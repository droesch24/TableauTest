/* ============================= RENDER: SYNTAX ANATOMY / DATA TABLE ============================= */
function renderFormulaBox(formula){ return `<div class="formula-box">${formula.replace(/</g,'&lt;')}</div>`; }
function renderTable(result){
  const {cols, rows, highlightLast} = result;
  return `<div class="table-scroll"><table class="data">
    <thead><tr>${cols.map((c,i)=>`<th class="${highlightLast && i===cols.length-1 ? 'highlight-col':''}">${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map((v,i)=>{
      const isLast = highlightLast && i===r.length-1;
      const isNum = typeof v==='number' || (typeof v==='string' && /^-?\$/.test(v));
      return `<td class="${isNum?'num':''} ${isLast?'highlight-col':''} ${typeof v==='string'&&v.startsWith('-')?'neg':''}">${v}</td>`;
    }).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}
function renderDeepDive(dd){
  return `<section class="block">
    <h3>${dd.title}</h3>
    <div class="deepdive-intro">${dd.intro}</div>
    ${dd.truthTable ? `<div class="truth-table">${renderTable(dd.truthTable)}</div>` : ''}
    ${dd.precedenceNote ? `<div class="precedence-note">${dd.precedenceNote}</div>` : ''}
    ${dd.liveExample ? `
      <div class="example-label">${dd.liveExample.title}</div>
      <div class="example-desc">${dd.liveExample.description}</div>
      ${dd.liveExample.legend ? `<div class="condition-legend">${dd.liveExample.legend.map(l=>`<div><span class="letter">${l.letter} =</span><code>${l.expr}</code></div>`).join('')}</div>` : ''}
      ${renderTable(dd.liveExample.compute())}
    ` : ''}
    ${dd.examples ? dd.examples.map((ex,i)=>`
      ${i>0 ? '<hr class="example-divider">' : ''}
      <div class="example-label">${ex.title}</div>
      <div class="example-desc">${ex.description}</div>
      ${renderTable(ex.compute())}
    `).join('') : ''}
    ${dd.notes ? `
      <ul class="pitfalls-list" style="margin-top:16px;">
        ${dd.notes.map(n=>`<li><span class="pitfall-icon">!</span><span class="pitfall-body"><b>${n.title}</b><span>${n.text}</span></span></li>`).join('')}
      </ul>
    ` : ''}
  </section>`;
}

/* ============================= RENDER: EXERCISE ============================= */
function tokenBtnsHtml(list, cls, wrapField){
  return list.map(v=>`<button type="button" class="token-btn ${cls}" data-token="${wrapField ? '['+v+']' : v}">${wrapField? '['+v+']' : v}</button>`).join('');
}
function renderExercise(lesson){
  if(lesson.exercise && lesson.exercise.type==='concept'){
    const ex = lesson.exercise;
    return `<div class="exercise" id="exerciseBox">
      <h3>Concept Check</h3>
      <div class="build-prompt">${ex.q}</div>
      <div class="mc-options">${ex.options.map((opt,i)=>`<button class="mc-option" data-idx="${i}">${opt}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>
      <button class="build-actions" style="border:none;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;margin-top:10px;font-size:12px;" id="hintBtn">Show hint</button>
      <div class="hint-text" id="hintText">${ex.hint}</div>
    </div>`;
  }
  const b = lesson.build;
  const fieldNames = ALL_FIELDS.map(f=>f.slice(1,-1));
  return `<div class="exercise" id="exerciseBox">
    <h3>Build It</h3>
    <div class="build-prompt">${b.prompt}</div>
    <div class="palette">
      <div class="palette-group">
        <div class="palette-label">Fields</div>
        <div class="palette-tokens">${tokenBtnsHtml(fieldNames, '', true)}</div>
      </div>
      ${b.palette.functions.length? `<div class="palette-group"><div class="palette-label">Functions</div><div class="palette-tokens">${b.palette.functions.map(f=>`<button type="button" class="token-btn" data-token="${f}(">${f}(</button>`).join('')}</div></div>` : ''}
      ${b.palette.keywords.length? `<div class="palette-group"><div class="palette-label">Keywords</div><div class="palette-tokens">${tokenBtnsHtml(b.palette.keywords,'kw',false)}</div></div>` : ''}
      ${b.palette.operators.length? `<div class="palette-group"><div class="palette-label">Operators</div><div class="palette-tokens">${tokenBtnsHtml(b.palette.operators,'op',false)}</div></div>` : ''}
    </div>
    <textarea id="formulaInput" placeholder="Build your formula here, e.g. AVG([Profit])" spellcheck="false"></textarea>
    <div class="build-actions">
      <button class="primary" id="checkFormulaBtn">Check Formula</button>
      <button id="hintBtn">Hint</button>
      <button id="solutionBtn">Show solution</button>
    </div>
    <div class="hint-text" id="hintText">${b.hint}</div>
    <div class="solution-text" id="solutionText"><code>${b.solution}</code></div>
    <div class="feedback" id="feedback"></div>
    <div class="result-table-wrap" id="resultTableWrap"></div>
  </div>`;
}

function wireExercise(lesson){
  if(lesson.exercise && lesson.exercise.type==='concept'){
    const ex = lesson.exercise;
    const feedback = document.getElementById('feedback');
    document.querySelectorAll('.mc-option').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.dataset.idx,10);
        document.querySelectorAll('.mc-option').forEach(b=>b.classList.remove('correct','incorrect'));
        if(idx===ex.answer){
          btn.classList.add('correct');
          completed.add(lesson.id); saveProgress();
          feedback.className='feedback show ok'; feedback.textContent='\u2713 Correct! Lesson marked complete.';
          renderSidebar();
        } else {
          btn.classList.add('incorrect');
          feedback.className='feedback show bad'; feedback.textContent='\u2717 Not quite \u2014 try again, or check the hint.';
        }
      });
    });
    document.getElementById('hintBtn').addEventListener('click', ()=>document.getElementById('hintText').classList.toggle('show'));
    return;
  }

  const b = lesson.build;
  const input = document.getElementById('formulaInput');
  let lastSelStart = 0, lastSelEnd = 0;
  const trackSel = () => { lastSelStart = input.selectionStart; lastSelEnd = input.selectionEnd; };
  input.addEventListener('keyup', trackSel);
  input.addEventListener('click', trackSel);
  input.addEventListener('select', trackSel);

  document.querySelectorAll('.token-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tok = btn.dataset.token;
      const val = input.value;
      const insert = (lastSelStart>0 && val[lastSelStart-1] && /\S/.test(val[lastSelStart-1]) && !val[lastSelStart-1].match(/[\(\[]/)) ? ' '+tok : tok;
      input.value = val.slice(0,lastSelStart) + insert + val.slice(lastSelEnd);
      const newPos = lastSelStart + insert.length;
      input.focus(); input.setSelectionRange(newPos,newPos);
      lastSelStart = lastSelEnd = newPos;
    });
  });

  document.getElementById('hintBtn').addEventListener('click', ()=>document.getElementById('hintText').classList.toggle('show'));
  document.getElementById('solutionBtn').addEventListener('click', ()=>document.getElementById('solutionText').classList.toggle('show'));

  document.getElementById('checkFormulaBtn').addEventListener('click', ()=>{
    const feedback = document.getElementById('feedback');
    const resultWrap = document.getElementById('resultTableWrap');
    const formulaStr = input.value.trim();
    if(!formulaStr){
      feedback.className='feedback show err'; feedback.textContent='Type or build a formula first.'; resultWrap.innerHTML=''; return;
    }
    let target;
    try {
      target = runFormula(b.solution, b, sampleData);
    } catch(e){ /* shouldn't happen, reference solution is validated */ target = null; }

    let result;
    try {
      result = runFormula(formulaStr, b, sampleData);
    } catch(e){
      feedback.className='feedback show err';
      feedback.textContent = '\u26a0 ' + e.message;
      resultWrap.innerHTML='';
      return;
    }

    const marks = b.getMarks(sampleData);
    const matches = result.map((v,i)=> valuesEqual(v, target[i]));
    const allMatch = matches.every(Boolean) && result.length===target.length;

    resultWrap.innerHTML = `<div class="table-scroll"><table class="data">
      <thead><tr><th>Mark</th><th>Your Result</th><th>Target</th><th>Match</th></tr></thead>
      <tbody>${marks.map((m,i)=>`<tr>
        <td>${m.label}</td>
        <td class="num">${b.format(result[i])}</td>
        <td class="num">${b.format(target[i])}</td>
        <td>${matches[i] ? '<span class="match-yes">\u2713</span>' : '<span class="match-no">\u2717</span>'}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;

    if(allMatch){
      completed.add(lesson.id); saveProgress();
      feedback.className='feedback show ok';
      feedback.textContent = `\u2713 Correct! All ${result.length} marks match. Lesson complete.`;
      renderSidebar();
    } else {
      const nMatch = matches.filter(Boolean).length;
      feedback.className='feedback show bad';
      feedback.textContent = `${nMatch} of ${result.length} marks match. Check the mismatched rows below, or use the hint.`;
    }
  });
}

/* ============================= DEEP LINKING =============================
   #lesson=<id>&scroll=build&demo=1   jump straight to a lesson (optionally scroll to / auto-run the exercise)
   ============================================================================ */
function applyHashParams(){
  const hash = (location.hash || '').replace(/^#/, '');
  if(!hash) return;
  const params = new URLSearchParams(hash);
  const lessonId = params.get('lesson');
  if(lessonId){
    const idx = lessons.findIndex(l=>l.id===lessonId);
    if(idx !== -1) currentIdx = idx;
  }
  renderApp();
  if(params.get('scroll')==='build'){
    const el = document.getElementById('exerciseBox');
    if(el && typeof el.scrollIntoView === 'function') el.scrollIntoView({behavior:'instant', block:'start'});
  }
  if(params.get('demo')==='1' && lessons[currentIdx].build){
    const input = document.getElementById('formulaInput');
    const checkBtn = document.getElementById('checkFormulaBtn');
    if(input && checkBtn){
      input.value = lessons[currentIdx].build.solution;
      setTimeout(()=>checkBtn.click(), 250);
    }
  }
}

/* ============================= INIT ============================= */
function boot(){ renderApp(); applyHashParams(); }
if(typeof tableau !== 'undefined' && tableau.extensions){
  tableau.extensions.initializeAsync().then(boot).catch(boot);
} else {
  boot();
}
</script>
</body>
</html>
