<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculation Tutor</title>
<script src="tableau.extensions.1.latest.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --border:#e1e4e9; --text:#1f2430; --muted:#6b7280;
    --accent:#0e6e55; --accent-light:#e6f4f0; --warn:#b5461f; --warn-light:#fbe9e2;
    --code-bg:#1e2430; --code-text:#dbe4ee; --blue:#28577a; --blue-light:#e8f0f7;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{position:relative;height:100vh;min-height:600px;}
  #modeRoot{display:flex;width:100%;height:100%;}

  /* Sidebar */
  #sidebar{width:270px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:16px 0;}
  #sidebar h1{font-size:15px;margin:0 16px 4px;color:var(--text);}
  #sidebar .subtitle{font-size:11.5px;color:var(--muted);margin:0 16px 14px;}
  .progress-wrap{margin:0 16px 16px;}
  .progress-bar-bg{height:6px;background:var(--border);border-radius:4px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--accent);transition:width .3s;}
  .progress-label{font-size:11px;color:var(--muted);margin-top:4px;}
  .track{margin-bottom:6px;}
  .track-header{padding:9px 16px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  .lesson-item{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;font-size:13px;color:var(--text);border-left:3px solid transparent;}
  .lesson-item:hover{background:var(--bg);}
  .lesson-item.active{background:var(--accent-light);border-left-color:var(--accent);font-weight:600;}
  .lesson-check{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;}
  .lesson-check.done{background:var(--accent);border-color:var(--accent);}

  /* Main */
  #main{flex:1;overflow-y:auto;padding:28px 40px 60px;}
  .lesson-eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700;margin-bottom:6px;}
  .lesson-title{font-size:24px;margin:0 0 14px;}
  .concept{font-size:14.5px;line-height:1.6;color:#333;margin-bottom:22px;max-width:760px;}
  .concept p{margin:0 0 10px;}
  .concept p:last-child{margin-bottom:0;}

  .example-label{font-size:12.5px;font-weight:600;color:var(--text);margin:0 0 4px;}
  .example-desc{font-size:12.5px;color:var(--muted);margin:0 0 12px;}
  .example-divider{border:none;border-top:1px solid var(--border);margin:20px 0;}

  .pitfalls-list{list-style:none;margin:0;padding:0;}
  .pitfalls-list li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:13px;}
  .pitfalls-list li:first-child{border-top:none;padding-top:2px;}
  .pitfall-icon{flex-shrink:0;width:20px;height:20px;border-radius:5px;background:var(--warn-light);color:var(--warn);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;}
  .pitfall-body b{display:block;color:var(--text);margin-bottom:2px;}
  .pitfall-body span{color:var(--muted);}

  .related-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .related-chip{background:var(--blue-light);color:var(--blue);border-radius:6px;padding:8px 12px;font-size:12.5px;max-width:100%;}
  .related-chip b{display:inline;}

  .deepdive-intro{font-size:13.5px;line-height:1.6;color:#333;margin-bottom:14px;}
  .deepdive-intro p{margin:0 0 10px;}
  .deepdive-intro p:last-child{margin-bottom:0;}
  .deepdive-intro code{background:var(--code-bg);color:var(--code-text);padding:1px 6px;border-radius:4px;font-family:'Consolas',monospace;font-size:12px;}
  .precedence-note{background:var(--blue-light);border-left:3px solid var(--blue);border-radius:0 6px 6px 0;padding:10px 14px;font-size:12.5px;color:var(--text);margin:14px 0;}
  .condition-legend{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;}
  .condition-legend div{display:flex;gap:8px;padding:3px 0;align-items:center;}
  .condition-legend .letter{font-family:'Consolas',monospace;font-weight:700;color:var(--blue);white-space:nowrap;flex-shrink:0;min-width:22px;}
  .condition-legend code{background:var(--code-bg);color:var(--code-text);padding:1px 6px;border-radius:4px;font-family:'Consolas',monospace;font-size:12px;}
  .precedence-note code{background:var(--code-bg);color:var(--code-text);padding:1px 6px;border-radius:4px;font-family:'Consolas',monospace;font-size:12px;}
  .truth-table{margin-bottom:16px;}
  .bool-true{color:var(--accent);font-weight:600;}
  .bool-false{color:var(--warn);font-weight:600;}

  .concept code{background:var(--code-bg);color:var(--code-text);padding:1px 6px;border-radius:4px;font-family:'Consolas',monospace;font-size:12.5px;}

  section.block{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 22px;margin-bottom:20px;max-width:900px;}
  section.block h3{margin:0 0 12px;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}

  /* Syntax anatomy */
  .formula-box{background:var(--code-bg);color:var(--code-text);border-radius:8px;padding:16px 18px;font-family:'Consolas',monospace;font-size:14px;line-height:1.7;margin-bottom:14px;white-space:pre-wrap;word-break:break-word;}
  .anatomy-list{list-style:none;margin:0;padding:0;}
  .anatomy-list li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:13px;}
  .anatomy-list li:first-child{border-top:none;}
  .anatomy-tag{font-family:'Consolas',monospace;background:var(--blue-light);color:var(--blue);border-radius:4px;padding:1px 7px;font-size:12px;flex-shrink:0;height:fit-content;}

  /* data table */
  table.data{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.data th{text-align:left;background:var(--bg);color:var(--muted);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;}
  table.data td{padding:6px 10px;border-bottom:1px solid #f0f1f3;}
  table.data tr:hover td{background:#fafbfc;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .highlight-col{background:var(--accent-light)!important;font-weight:600;}
  .neg{color:var(--warn);}
  .table-scroll{max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;}

  /* Build-It exercise */
  .exercise{border:1px solid var(--border);border-radius:10px;padding:18px 22px;max-width:900px;background:#fbfbfc;}
  .exercise h3{margin:0 0 4px;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .build-prompt{font-size:14px;margin:8px 0 14px;}
  .palette{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;}
  .palette-group{display:flex;flex-direction:column;gap:5px;}
  .palette-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;}
  .palette-tokens{display:flex;flex-wrap:wrap;gap:5px;max-width:520px;}
  .token-btn{font-family:'Consolas',monospace;font-size:12px;background:#fff;border:1px solid var(--border);border-radius:5px;padding:4px 9px;cursor:pointer;color:var(--blue);}
  .token-btn:hover{background:var(--blue-light);border-color:var(--blue);}
  .token-btn.kw{color:var(--accent);}
  .token-btn.op{color:var(--text);}
  #formulaInput{width:100%;min-height:70px;font-family:'Consolas',monospace;font-size:13.5px;border:1px solid var(--border);border-radius:8px;padding:12px 14px;resize:vertical;background:var(--code-bg);color:var(--code-text);}
  #formulaInput:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .build-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center;}
  .build-actions button{border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--text);}
  .build-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .build-actions button.primary:hover{opacity:.9;}
  .build-actions button:not(.primary):hover{border-color:var(--accent);color:var(--accent);}
  .hint-text, .solution-text{font-size:12.5px;color:var(--muted);margin-top:10px;display:none;}
  .hint-text.show, .solution-text.show{display:block;}
  .solution-text code{background:var(--code-bg);color:var(--code-text);padding:6px 10px;border-radius:6px;display:inline-block;margin-top:4px;font-family:'Consolas',monospace;}
  .feedback{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:6px;display:none;}
  .feedback.show.ok{display:block;background:var(--accent-light);color:var(--accent);font-weight:600;}
  .feedback.show.bad{display:block;background:var(--warn-light);color:var(--warn);}
  .feedback.show.err{display:block;background:#fff4e5;color:#9a5b00;font-family:'Consolas',monospace;font-size:12.5px;}
  .result-table-wrap{margin-top:14px;}
  .match-yes{color:var(--accent);font-weight:700;}
  .match-no{color:var(--warn);font-weight:700;}

  .nav-buttons{display:flex;justify-content:space-between;max-width:900px;margin-top:26px;}
  .nav-buttons button{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:9px 16px;font-size:13px;cursor:pointer;color:var(--text);}
  .nav-buttons button:hover{border-color:var(--accent);color:var(--accent);}
  .nav-buttons button:disabled{opacity:.35;cursor:default;}

  /* Concept-check (lod-why, tc-basics) */
  .mc-options{display:flex;flex-direction:column;gap:8px;max-width:480px;}
  .mc-option{border:1px solid var(--border);background:#fff;border-radius:7px;padding:9px 14px;cursor:pointer;font-size:13.5px;text-align:left;}
  .mc-option:hover{border-color:var(--accent);}
  .mc-option.correct{background:var(--accent-light);border-color:var(--accent);}
  .mc-option.incorrect{background:var(--warn-light);border-color:var(--warn);}

</style>
</head>

<script>

  {id:14, date:'2024-02-06', region:'East',    category:'Office Supplies', subCategory:'Storage',     customer:'E. Novak', sales:134.50,  profit:28.10,  qty:4},
  {id:15, date:'2024-02-09', region:'West',    category:'Furniture',       subCategory:'Chairs',      customer:'F. Osei',  sales:421.75,  profit:-15.60, qty:2},
  {id:16, date:'2024-02-12', region:'Central', category:'Office Supplies', subCategory:'Binders',     customer:'C. Wu',    sales:78.30,   profit:25.40,  qty:5},
  {id:17, date:'2024-02-14', region:'East',    category:'Technology',      subCategory:'Accessories', customer:'A. Diaz',  sales:267.90,  profit:61.20,  qty:3},
  {id:18, date:'2024-02-17', region:'West',    category:'Technology',      subCategory:'Phones',      customer:'B. Chen',  sales:1105.20, profit:245.80, qty:2},
  {id:19, date:'2024-02-20', region:'Central', category:'Furniture',       subCategory:'Tables',      customer:'D. Patel', sales:745.60,  profit:-88.40, qty:1},
  {id:20, date:'2024-02-23', region:'East',    category:'Furniture',       subCategory:'Bookcases',   customer:'E. Novak', sales:412.30,  profit:-32.10, qty:2},
];
const money = n => (n<0? '-$'+Math.abs(n).toFixed(2) : '$'+n.toFixed(2));
const pct = n => (n*100).toFixed(1)+'%';
const sum = (arr,f) => arr.reduce((a,r)=>a+f(r),0);
const groupBy = (arr,f) => { const m={}; arr.forEach(r=>{const k=f(r); (m[k]=m[k]||[]).push(r);}); return m; };
const uniq = arr => [...new Set(arr)];

/* ============================= CALC FORMULA ENGINE ============================= */
class CalcError extends Error {}
const FIELD_MAP = {
  'sales':'sales', 'profit':'profit', 'quantity':'qty', 'qty':'qty',
  'category':'category', 'sub-category':'subCategory', 'subcategory':'subCategory',
  'region':'region', 'customer':'customer', 'order date':'date', 'date':'date'
};
const DIMENSION_FIELDS = new Set(['category','subCategory','region','customer','date']);
function resolveField(raw){
  const inner = raw.slice(1,-1).trim().toLowerCase();
  const key = FIELD_MAP[inner];
  if(!key) throw new CalcError(`Unknown field ${raw}. Available: [Sales], [Profit], [Quantity], [Category], [Sub-Category], [Region], [Customer], [Order Date]`);
  return key;
}
function tokenize(str){
  const tokens = []; let i = 0;
  const KEYWORDS = new Set(['IF','THEN','ELSEIF','ELSE','END','CASE','WHEN','FIXED','INCLUDE','EXCLUDE','AND','OR','NOT']);
  while(i < str.length){
    const c = str[i];
    if(/\s/.test(c)){ i++; continue; }
    if(c === '['){
      const j = str.indexOf(']', i);
      if(j === -1) throw new CalcError(`Missing closing "]" for a field reference`);
      tokens.push({type:'FIELD', value: str.slice(i, j+1)}); i = j+1; continue;
    }
    if(c === "'"){
      let j = i+1, buf = '';
      while(j < str.length && str[j] !== "'"){ if(str[j] === '\\'){ buf += str[j+1]; j += 2; } else { buf += str[j]; j++; } }
      if(j >= str.length) throw new CalcError(`Missing closing quote for a text value`);
      tokens.push({type:'STRING', value: buf}); i = j+1; continue;
    }
    if(/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(str[i+1]||''))){
      let j = i; while(j < str.length && /[0-9.]/.test(str[j])) j++;
      tokens.push({type:'NUMBER', value: parseFloat(str.slice(i,j))}); i = j; continue;
    }
    if(/[A-Za-z_]/.test(c)){
      let j = i; while(j < str.length && /[A-Za-z_0-9]/.test(str[j])) j++;
      const word = str.slice(i,j); const upper = word.toUpperCase();
      tokens.push({type: KEYWORDS.has(upper) ? 'KEYWORD' : 'IDENT', value: word}); i = j; continue;
    }
    if(c === '>' && str[i+1] === '='){ tokens.push({type:'OP', value:'>='}); i+=2; continue; }
    if(c === '<' && str[i+1] === '='){ tokens.push({type:'OP', value:'<='}); i+=2; continue; }
    if(c === '<' && str[i+1] === '>'){ tokens.push({type:'OP', value:'<>'}); i+=2; continue; }
    if('(){}:,+-*/><='.includes(c)){ tokens.push({type:'PUNCT', value:c}); i++; continue; }
    throw new CalcError(`Unexpected character "${c}" in formula`);
  }
  tokens.push({type:'EOF', value:null});
  return tokens;
}
function parse(str){
  const tokens = tokenize(str); let pos = 0;
  const peek = () => tokens[pos];
  const isKw = (w) => peek().type === 'KEYWORD' && peek().value.toUpperCase() === w;
  const next = () => tokens[pos++];
  const describe = (t) => t.type==='EOF' ? 'end of formula' : `"${t.value}"`;
  const expectPunct = (p) => { if(peek().type!=='PUNCT' || peek().value!==p) throw new CalcError(`Expected "${p}" but found ${describe(peek())}`); return next(); };
  const expectKw = (w) => { if(!isKw(w)) throw new CalcError(`Expected ${w} but found ${describe(peek())}`); return next(); };
  function parseExpr(){ return parseOr(); }
  function parseOr(){ let l = parseAnd(); while(isKw('OR')){ next(); const r = parseAnd(); l = {type:'Bin', op:'OR', l, r}; } return l; }
  function parseAnd(){ let l = parseNot(); while(isKw('AND')){ next(); const r = parseNot(); l = {type:'Bin', op:'AND', l, r}; } return l; }
  function parseNot(){ if(isKw('NOT')){ next(); return {type:'Unary', op:'NOT', arg: parseNot()}; } return parseComparison(); }
  function parseComparison(){
    let l = parseAdd();
    if(peek().type==='OP' || (peek().type==='PUNCT' && (peek().value==='>'||peek().value==='<'||peek().value==='='))){
      const op = next().value; const r = parseAdd(); l = {type:'Bin', op, l, r};
    }
    return l;
  }
  function parseAdd(){ let l = parseMul(); while(peek().type==='PUNCT' && (peek().value==='+' || peek().value==='-')){ const op = next().value; const r = parseMul(); l = {type:'Bin', op, l, r}; } return l; }
  function parseMul(){ let l = parseUnary(); while(peek().type==='PUNCT' && (peek().value==='*' || peek().value==='/')){ const op = next().value; const r = parseUnary(); l = {type:'Bin', op, l, r}; } return l; }
  function parseUnary(){ if(peek().type==='PUNCT' && peek().value==='-'){ next(); return {type:'Unary', op:'-', arg: parseUnary()}; } return parsePrimary(); }
  function parseFieldTok(){ if(peek().type!=='FIELD') throw new CalcError(`Expected a field like [Sales] but found ${describe(peek())}`); return next(); }
  function parsePrimary(){
    const t = peek();
    if(t.type==='NUMBER'){ next(); return {type:'Num', value:t.value}; }
    if(t.type==='STRING'){ next(); return {type:'Str', value:t.value}; }
    if(t.type==='FIELD'){ next(); return {type:'Field', raw:t.value}; }
    if(t.type==='PUNCT' && t.value==='('){ next(); const e = parseExpr(); expectPunct(')'); return e; }
    if(t.type==='PUNCT' && t.value==='{'){
      next();
      let kindTok;
      if(isKw('FIXED')||isKw('INCLUDE')||isKw('EXCLUDE')) kindTok = next().value.toUpperCase();
      else throw new CalcError(`Expected FIXED, INCLUDE, or EXCLUDE after "{" but found ${describe(peek())}`);
      const dims = [parseFieldTok()];
      while(peek().type==='PUNCT' && peek().value===','){ next(); dims.push(parseFieldTok()); }
      expectPunct(':'); const inner = parseExpr(); expectPunct('}');
      return {type:'Lod', kind:kindTok, dims, expr:inner};
    }
    if(isKw('IF')){
      next(); const conds = [];
      const cond0 = parseExpr(); expectKw('THEN'); const then0 = parseExpr();
      conds.push({cond:cond0, then:then0});
      while(isKw('ELSEIF')){ next(); const c = parseExpr(); expectKw('THEN'); const th = parseExpr(); conds.push({cond:c, then:th}); }
      let elseExpr = null; if(isKw('ELSE')){ next(); elseExpr = parseExpr(); }
      expectKw('END');
      return {type:'If', conds, else:elseExpr};
    }
    if(isKw('CASE')){
      next(); const subject = parseExpr(); const whens = [];
      while(isKw('WHEN')){ next(); const m = parseExpr(); expectKw('THEN'); const th = parseExpr(); whens.push({match:m, then:th}); }
      if(whens.length===0) throw new CalcError('CASE needs at least one WHEN ... THEN branch');
      let elseExpr = null; if(isKw('ELSE')){ next(); elseExpr = parseExpr(); }
      expectKw('END');
      return {type:'Case', subject, whens, else:elseExpr};
    }
    if(t.type==='IDENT'){
      next(); const name = t.value.toUpperCase();
      if(peek().type==='PUNCT' && peek().value==='('){
        next(); const args = [];
        if(!(peek().type==='PUNCT' && peek().value===')')){ args.push(parseExpr()); while(peek().type==='PUNCT' && peek().value===','){ next(); args.push(parseExpr()); } }
        expectPunct(')');
        return {type:'Call', name, args};
      }
      throw new CalcError(`"${t.value}" isn't a recognized function or keyword`);
    }
    throw new CalcError(`Unexpected ${describe(t)} in formula`);
  }
  if(peek().type==='EOF') throw new CalcError('Formula is empty');
  const ast = parseExpr();
  if(peek().type!=='EOF') throw new CalcError(`Unexpected ${describe(peek())} after end of formula`);
  return ast;
}
function groupByDims(rows, dims){
  const map = new Map();
  rows.forEach(r=>{ const key = dims.map(d=>r[d]).join('||'); if(!map.has(key)) map.set(key, []); map.get(key).push(r); });
  return map;
}
function makeFullDataGroups(fullData){
  const cache = new Map();
  return (dims) => { const sig = dims.join(','); if(!cache.has(sig)) cache.set(sig, groupByDims(fullData, dims)); return cache.get(sig); };
}
function truthy(v){ return v !== null && v !== undefined && v !== false && v !== 0 && v !== ''; }
function lodDimsFor(kind, dims, viewDims){
  if(kind==='FIXED') return dims;
  if(kind==='INCLUDE') return [...new Set([...(viewDims||[]), ...dims])];
  return (viewDims||[]).filter(d=>!dims.includes(d));
}
function evalNode(node, ctx){
  switch(node.type){
    case 'Num': return node.value;
    case 'Str': return node.value;
    case 'Field': {
      const key = resolveField(node.raw);
      if(ctx.mode==='row') return ctx.row[key];
      if(DIMENSION_FIELDS.has(key)) return ctx.rows[0] ? ctx.rows[0][key] : null;
      return ctx.rows.reduce((a,r)=>a+(r[key]||0),0);
    }
    case 'Unary': { const v = evalNode(node.arg, ctx); return node.op==='-' ? -v : !truthy(v); }
    case 'Bin': {
      if(node.op==='AND') return truthy(evalNode(node.l,ctx)) && truthy(evalNode(node.r,ctx));
      if(node.op==='OR') return truthy(evalNode(node.l,ctx)) || truthy(evalNode(node.r,ctx));
      const l = evalNode(node.l,ctx), r = evalNode(node.r,ctx);
      switch(node.op){
        case '+': return (typeof l==='string'||typeof r==='string') ? String(l)+String(r) : l+r;
        case '-': return l-r; case '*': return l*r; case '/': return r===0 ? null : l/r;
        case '>': return l>r; case '<': return l<r; case '>=': return l>=r; case '<=': return l<=r;
        case '=': return l===r; case '<>': return l!==r;
        default: throw new CalcError(`Unknown operator ${node.op}`);
      }
    }
    case 'If': { for(const c of node.conds){ if(truthy(evalNode(c.cond, ctx))) return evalNode(c.then, ctx); } return node.else ? evalNode(node.else, ctx) : null; }
    case 'Case': {
      const subj = evalNode(node.subject, ctx);
      for(const w of node.whens){ if(evalNode(w.match, ctx) === subj) return evalNode(w.then, ctx); }
      return node.else ? evalNode(node.else, ctx) : null;
    }
    case 'Lod': {
      const dims = node.dims.map(d=>resolveField(d.value));
      const lodDims = lodDimsFor(node.kind, dims, ctx.viewDims);
      const repRow = ctx.mode==='row' ? ctx.row : ctx.rows[0];
      const key = lodDims.map(d=>repRow[d]).join('||');
      const group = ctx.fullDataGroups(lodDims).get(key) || [];
      return evalNode(node.expr, {mode:'mark', rows:group, viewDims: lodDims, fullDataGroups: ctx.fullDataGroups});
    }
    case 'Call': {
      const fn = node.name;
      if(['SUM','AVG','COUNTD','COUNT','MIN','MAX'].includes(fn)){
        if(node.args.length!==1) throw new CalcError(`${fn}() takes exactly one argument`);
        const arg = node.args[0];
        let rows = ctx.mode==='row' ? [ctx.row] : ctx.rows;
        if(arg.type==='Lod'){
          const dims = arg.dims.map(d=>resolveField(d.value));
          const lodDims = lodDimsFor(arg.kind, dims, ctx.viewDims);
          const seen = new Set(); const deduped = [];
          for(const r of rows){ const k = lodDims.map(d=>r[d]).join('||'); if(!seen.has(k)){ seen.add(k); deduped.push(r); } }
          rows = deduped;
        }
        const values = rows.map(r => evalNode(arg, {mode:'row', row:r, viewDims:ctx.viewDims, fullDataGroups:ctx.fullDataGroups}));
        switch(fn){
          case 'SUM': return values.reduce((a,b)=>a+(b||0),0);
          case 'AVG': return values.length ? values.reduce((a,b)=>a+(b||0),0)/values.length : null;
          case 'COUNTD': return new Set(values.filter(v=>v!=null)).size;
          case 'COUNT': return values.filter(v=>v!=null).length;
          case 'MIN': return Math.min(...values);
          case 'MAX': return Math.max(...values);
        }
      }
      if(['RUNNING_SUM','RANK','WINDOW_AVG','WINDOW_SUM','TOTAL'].includes(fn)){
        if(!ctx.tableCalc) throw new CalcError(`${fn}() is a table calculation and can only be used in a table-calculation exercise`);
        if(node.args.length!==1) throw new CalcError(`${fn}() takes exactly one argument`);
        return ctx.tableCalc(fn, node.args[0]);
      }
      if(fn==='ABS') return Math.abs(evalNode(node.args[0], ctx));
      throw new CalcError(`Unknown function ${fn}(). Available: SUM, AVG, COUNTD, COUNT, MIN, MAX, RUNNING_SUM, RANK, WINDOW_AVG, TOTAL`);
    }
    default: throw new CalcError('Internal error: unknown node type');
  }
}
function runFormula(formulaStr, build, fullData){
  const ast = parse(formulaStr);
  const fullDataGroups = makeFullDataGroups(fullData);
  const marks = build.getMarks(fullData);
  if(build.calcKind === 'tablecalc'){
    let ordered = build.addressDim
      ? [...marks].sort((a,b)=> a.rows[0][build.addressDim] > b.rows[0][build.addressDim] ? 1 : -1)
      : marks.slice();
    ordered.forEach(m => { m._partKey = (build.partitionDims||[]).map(d=>m.rows[0][d]).join('||'); });
    const innerCache = new Map();
    function getInnerValues(argNode){
      if(innerCache.has(argNode)) return innerCache.get(argNode);
      const vals = ordered.map(m => evalNode(argNode, {mode:'mark', rows:m.rows, viewDims: build.viewDims, fullDataGroups}));
      innerCache.set(argNode, vals); return vals;
    }
    function tableCalc(fnName, argNode, currentMark){
      const vals = getInnerValues(argNode);
      const idx = ordered.indexOf(currentMark);
      const partKey = currentMark._partKey;
      const partIdxs = ordered.map((m,i)=>i).filter(i=>ordered[i]._partKey===partKey);
      const partVals = partIdxs.map(i=>vals[i]);
      switch(fnName){
        case 'RUNNING_SUM': return partIdxs.filter(i=>i<=idx).reduce((a,i)=>a+vals[i],0);
        case 'RANK': { const cur = vals[idx]; return 1 + partVals.filter(v=>v>cur).length; }
        case 'WINDOW_AVG': return partVals.reduce((a,b)=>a+b,0)/partVals.length;
        case 'WINDOW_SUM': case 'TOTAL': return partVals.reduce((a,b)=>a+b,0);
      }
    }
    return marks.map(m => evalNode(ast, {mode:'mark', rows:m.rows, viewDims: build.viewDims, fullDataGroups, tableCalc: (fn,argNode)=>tableCalc(fn,argNode,m)}));
  }
  return marks.map(m => evalNode(ast, {mode:'mark', rows:m.rows, viewDims: build.viewDims, fullDataGroups}));
}
function approxEq(a,b,eps=0.01){ return Math.abs(a-b) < eps; }
function valuesEqual(a,b){
  if(typeof a==='number' && typeof b==='number') return approxEq(a,b);
  return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
}

const lessons = [
{id:'agg-basics', track:'Basics: Aggregation & Logic', title:'Aggregation Basics',
  concept:`<p>Every measure in Tableau is wrapped in an <b>aggregation function</b> by default &mdash; usually <code>SUM</code>. Aggregations collapse many rows down to one number per mark. The three you'll use constantly are <code>SUM</code>, <code>AVG</code>, and <code>COUNTD</code> (count distinct).</p><p><code>MIN</code> and <code>MAX</code> round out the basic set &mdash; useful for things like "earliest order date" or "largest single sale." Which aggregation you pick isn't just a display choice: SUM and AVG of the same field tell very different stories, and picking the wrong one is one of the most common analysis mistakes.</p>`,
  formula:'SUM([Sales])   AVG([Profit])   COUNTD([Customer])',
  anatomy:[
    {tag:'SUM(...)', text:'Adds every row\'s value together within the current level of detail.'},
    {tag:'AVG(...)', text:'Averages the values &mdash; sensitive to outliers like our -$120.50 Tables order.'},
    {tag:'COUNTD(...)', text:'Counts unique values. COUNT would count every row, even duplicate customers.'},
  ],
  compute(){
    const byRegion = groupBy(sampleData, r=>r.region);
    const rows = Object.entries(byRegion).map(([region,rs])=>({
      region, sales:sum(rs,r=>r.sales), profit:sum(rs,r=>r.profit)/rs.length, cust:uniq(rs.map(r=>r.customer)).length
    }));
    return {cols:['Region','SUM(Sales)','AVG(Profit)','COUNTD(Customer)'], rows: rows.map(r=>[r.region, money(r.sales), money(r.profit), r.cust])};
  },
  secondExample:{
    title:'Same aggregations, grouped by Category instead',
    description:'The formulas don\'t change \u2014 only the grouping (the view\'s dimensions) does. This is what "level of detail" means in practice.',
    compute(){
      const byCat = groupBy(sampleData, r=>r.category);
      const rows = Object.entries(byCat).map(([cat,rs])=>[cat, money(sum(rs,r=>r.sales)), money(sum(rs,r=>r.profit)/rs.length), uniq(rs.map(r=>r.customer)).length]);
      return {cols:['Category','SUM(Sales)','AVG(Profit)','COUNTD(Customer)'], rows};
    }
  },
  pitfalls:[
    {title:'COUNT vs COUNTD', text:'COUNT counts every row, including repeat orders from the same customer. COUNTD counts unique values. "How many customers bought Furniture" almost always means COUNTD.'},
    {title:'AVG hides outliers', text:'A single -$120.50 Tables order pulls the whole regional average down. Before trusting an AVG, glance at MIN/MAX or the row count behind it.'},
    {title:'Aggregating the wrong field type', text:'SUM/AVG only make sense on measures (numbers). Applying them to a dimension like Region either errors or silently does something unhelpful \u2014 use COUNTD or MIN/MAX for dimensions instead.'},

{id:'if-logic', track:'Basics: Aggregation & Logic', title:'IF / ELSEIF / END',
  concept:`<p><code>IF</code> statements classify rows based on a condition. They're evaluated <b>row by row</b> before any aggregation happens, which is why this is called a row-level calculation.</p><p>Branches are checked top to bottom, and the <b>first TRUE branch wins</b> &mdash; Tableau doesn't keep checking after it finds a match. You can chain as many ELSEIFs as you need, and conditions can combine with AND/OR/NOT, e.g. <code>IF [Profit] > 100 AND [Region] = 'East' THEN ...</code>.</p>`,
  formula:"IF [Profit] > 100 THEN 'High'\nELSEIF [Profit] > 0 THEN 'Low'\nELSE 'Loss'\nEND",
  anatomy:[
    {tag:'IF ... THEN', text:'Tests the first condition. If true, returns \'High\' and stops.'},
    {tag:'ELSEIF', text:'Only checked if the IF was false. You can chain as many ELSEIFs as you need.'},
    {tag:'ELSE', text:'Catches everything that didn\'t match &mdash; here, any profit &le; 0.'},
    {tag:'END', text:'Required to close every IF block in Tableau.'},
  ],
  deepDive:{
    title:'Deep Dive: Combining Conditions with AND / OR',
    intro:`<p>A single IF condition rarely captures a real business rule on its own. <code>AND</code> requires <b>both</b> sides to be true; <code>OR</code> requires <b>at least one</b>; <code>NOT</code> flips a condition's truth value. All three combine with the comparisons you already know (<code>&gt;</code>, <code>&lt;</code>, <code>=</code>, etc.) to build up more precise conditions.</p><p>Tableau doesn't use symbols like <code>&&</code>, <code>||</code>, or <code>!</code> for this &mdash; it's always the words AND, OR, and NOT, and they're case-insensitive like every other keyword.</p>`,
    truthTable:{
      cols:['A','B','A AND B','A OR B'],
      rows:[
        ['<span class="bool-true">TRUE</span>','<span class="bool-true">TRUE</span>','<span class="bool-true">TRUE</span>','<span class="bool-true">TRUE</span>'],
        ['<span class="bool-true">TRUE</span>','<span class="bool-false">FALSE</span>','<span class="bool-false">FALSE</span>','<span class="bool-true">TRUE</span>'],
        ['<span class="bool-false">FALSE</span>','<span class="bool-true">TRUE</span>','<span class="bool-false">FALSE</span>','<span class="bool-true">TRUE</span>'],
        ['<span class="bool-false">FALSE</span>','<span class="bool-false">FALSE</span>','<span class="bool-false">FALSE</span>','<span class="bool-false">FALSE</span>'],
      ]
    },
    precedenceNote:`<b>Precedence rule:</b> just like multiplication happens before addition in math, <code>AND</code> binds tighter than <code>OR</code>. <code>A OR B AND C</code> is evaluated as <code>A OR (B AND C)</code> &mdash; <b>not</b> <code>(A OR B) AND C</code>. The two groupings can give completely different results, so when in doubt, add the parentheses yourself rather than relying on memorizing the rule.`,
    liveExample:{
      title:'Same three fields, two different groupings \u2014 computed live',
      description:'All three formulas below run through the exact same engine as the rest of this tutorial. The first two (no parens vs. explicit matching parens) always agree \u2014 that\'s the precedence rule in action. The third, with different parens, disagrees on rows 1 and 5.',
      legend:[
        {letter:'A', expr:"[Profit] > 100"},
        {letter:'B', expr:"[Region] = 'East'"},

        const f1 = "[Profit] > 100 OR [Region] = 'East' AND [Quantity] > 2";

        });
        return {cols:['Customer','Profit','Region','Qty','A OR B AND C','A OR (B AND C)','(A OR B) AND C'], rows};

    },
    notes:[
      {title:'Default precedence matches "A OR (B AND C)"', text:'If that\'s genuinely what you mean, the formula works fine without parentheses \u2014 but writing them anyway costs nothing and saves the next person from having to memorize the rule.'},
      {title:'NOT only negates the very next condition', text:'NOT [Region] = \'East\' AND [Profit] > 0 negates just the region check, not the whole expression. To negate a combined condition, wrap it: NOT ([Region] = \'East\' AND [Profit] > 0).'},

{id:'row-vs-agg', track:'Basics: Aggregation & Logic', title:'Row-Level vs. Aggregate Calcs',
  concept:`<p>You have a stack of receipts, and you want one number: how much you spent on Technology, specifically.</p><p><b>The right way is to sort first, then add.</b> Go through the receipts one at a time, checking each one &mdash; "is this Technology?" &mdash; and only add the ones that say yes to your total. That's <code>SUM(IF [Category]='Technology' THEN [Sales] END)</code>: the IF checks each row, and SUM only adds up what passed the check.</p><p><b>The wrong way adds first, then tries to sort.</b> Add every receipt &mdash; Technology and everything else &mdash; into one grand total before checking anything. But once they're combined, that single number doesn't belong to any category anymore, so there's nothing left to sort. All you can ask about it is something like "is this bigger than $1,000?" &mdash; never "was this Technology?" That's exactly the trap in <code>IF SUM([Sales]) > 1000 THEN ... END</code>: by the time IF runs, the category information is already gone.</p>`,

      const avgTechProfit = sum(techRows, r=>r.profit)/techRows.length;

      return {cols:['Expression','Result','What it means'], rows:[
        ["AVG(IF [Category]='Technology' THEN [Profit] END)", money(avgTechProfit), 'Average Profit, Technology rows only'],
        ['AVG([Profit])', money(avgAllProfit), 'Average Profit, every row'],
      ]};
    }
  },
  pitfalls:[
    {title:'Tableau will actually stop you here', text:'If you try to mix these up, Tableau shows an error like "cannot mix aggregate and non-aggregate arguments." That error is a hint, not a punishment \u2014 it means: decide whether you\'re checking each row first, or checking one summed-up number. Put the IF inside the SUM to fix it.'},
    {title:'IF outside SUM asks about the total, not each row', text:'IF SUM([Sales]) > 1000 THEN ... END is asking one question about the grand total. It can\'t reach back and "un-mix" the rows that already got added together.'},
    {title:'This isn\'t the same as a filter', text:'A dashboard filter removes rows from view entirely. SUM(IF...) keeps every row in view but only adds up the ones that match \u2014 handy when you want to show a filtered total right next to the unfiltered one.'},
  ],
  related:[
    {title:'LOD Expressions', text:'a more powerful way to control exactly which rows an aggregation sees'},
    {title:'IF / ELSEIF', text:'refresher on the row-by-row checking step'},
  ],
  build:{
    prompt:'Build a calc that sums Sales for Technology rows only (a single total across the whole dataset).',
    calcKind:'aggregate', viewDims:[],
    getMarks:(data)=>[{label:'All rows (Technology-only total)', rows:data}],

    palette:{functions:['SUM'], keywords:['IF','THEN','END'], operators:['=']}
  }
},
{id:'lod-why', track:'LOD Expressions', title:'Why Level of Detail?',
  concept:`<p>Normally, Tableau groups numbers by whatever fields are on the view &mdash; completely automatically, no formula required. Put Region on the view, and <code>SUM(Sales)</code> becomes "total sales per region." Swap in Customer instead, and that exact same <code>SUM(Sales)</code> becomes "total sales per customer." The formula never changes &mdash; only the grouping does, based on what's sitting in the view.</p><p>Here's the problem LOD solves: sometimes you want a number that uses <i>different</i> grouping than the rest of the view. Say the view is grouped by Region, and you also want to show "this customer's all-time total" on every row &mdash; even though Customer isn't one of the fields in the view. A plain <code>SUM(Sales)</code> can't do that; it only knows how to follow the view's grouping. That's the wall Level of Detail (LOD) expressions break through.</p><p>An LOD expression is a formula that says: "for this one number, use different grouping than the view &mdash; here's exactly what I want instead." There are three ways to say that, and the next three lessons cover each one in full. This lesson is just about the core idea, so don't worry about memorizing FIXED/INCLUDE/EXCLUDE yet &mdash; just get comfortable with <i>why</i> you'd ever need any of them.</p>`,
  formula:'{ FIXED [dimension] : AGG([measure]) }\n{ INCLUDE [dimension] : AGG([measure]) }\n{ EXCLUDE [dimension] : AGG([measure]) }',
  anatomy:[
    {tag:'{ ... }', text:'The curly braces are how Tableau recognizes this as one LOD expression, rather than a regular formula.'},
    {tag:'FIXED', text:'"Use exactly these fields, no matter what\'s on the view." The most absolute of the three \u2014 covered in the next lesson.'},
    {tag:'INCLUDE', text:'"Use the view\'s fields, PLUS these extra ones." Makes the grouping more specific (finer) than the view.'},
    {tag:'EXCLUDE', text:'"Use the view\'s fields, MINUS these ones." Makes the grouping less specific (coarser) than the view.'},
  ],
  deepDive:{
    title:'Deep Dive: What "Level of Detail" Actually Means',
    intro:`<p>"Level of detail" sounds technical, but it's just a fancy way of asking: <b>how many rows get lumped together into one number?</b> A view grouped by Region lumps every row in the East together into one East number \u2014 that's a fairly zoomed-out "level of detail." A view grouped by Customer lumps far fewer rows together \u2014 a more zoomed-in level of detail.</p><p>Every LOD expression is just picking a different zoom level than the view, on purpose, for one specific number:</p>`,
    examples:[
      {
        title:'The same idea, laid out side by side',
        description:'"Ignore the view" (FIXED), "zoom in past the view" (INCLUDE), and "zoom out past the view" (EXCLUDE) are the only three moves available. Everything else in this track is just applying them.',
        compute(){
          return {cols:['What you write','What grouping it actually uses','In plain words'], rows:[
            ['SUM([Sales])  (no LOD)', 'Whatever the view already groups by', 'Automatic \u2014 no decision to make'],
            ["{FIXED [Customer]:SUM([Sales])}", 'Customer only, always', 'Ignores the view completely'],
            ["{INCLUDE [Customer]:SUM([Sales])}", "The view's grouping PLUS Customer", 'Zooms in \u2014 smaller groups than the view'],
            ["{EXCLUDE [Region]:SUM([Sales])}", "The view's grouping MINUS Region", 'Zooms out \u2014 bigger groups than the view'],
          ]};
        }
      }
    ],
    notes:[
      {title:'You don\'t need to memorize this yet', text:'Every time you reach for an LOD, ask yourself one question: does this number need to completely ignore the view (FIXED), zoom in past it (INCLUDE), or zoom out past it (EXCLUDE)? The next three lessons are just that one question, answered three different ways.'},
    ]
  },
  compute(){
    const byRegion = groupBy(sampleData, r=>r.region);
    const rows = Object.entries(byRegion).map(([region,rs])=>[region, money(sum(rs,r=>r.sales))]);
    return {cols:['Region','SUM(Sales)  \u2014  this is all a normal view can do'], rows};
  },
  secondExample:{
    title:'Now watch a normal SUM hit its limit',
    description:'Say you also want to show each customer\'s all-time total next to their region \u2014 not just this region\'s total, their overall total across every region. A plain SUM(Sales) literally cannot produce the last column below; it always follows the view. That\'s exactly the gap {FIXED [Customer] : SUM([Sales])} fills, which the next lesson covers in detail.',
    compute(){
      const byCust = groupBy(sampleData, r=>r.customer);
      const custTotals = {}; Object.entries(byCust).forEach(([c,rs])=>custTotals[c]=sum(rs,r=>r.sales));
      const rows = sampleData.slice(0,6).map(r=>[r.region, r.customer, money(r.sales), money(custTotals[r.customer])]);
      return {cols:['Region','Customer','This Order\'s Sales','Customer\'s All-Time Total (needs LOD)'], rows, highlightLast:true};
    }
  },
  pitfalls:[
    {title:'LOD vs. table calc mix-up', text:'They sound similar but run at different times \u2014 LOD while the data is first being gathered, table calcs after. If a formula won\'t validate, check you\'re not accidentally trying to use table-calc syntax (covered later) inside an LOD, or vice versa.'},
    {title:'FIXED ignores most filters by default', text:'Because FIXED is computed before dimension filters are applied, filtering the view often won\'t change its result. Surprising the first time you see it \u2014 covered more in the FIXED lesson.'},
    {title:'Reaching for FIXED out of habit', text:'If INCLUDE or EXCLUDE would work relative to your current view, they\'re usually easier to reason about than working out the full FIXED field list from scratch.'},
  ],
  related:[
    {title:'FIXED', text:'the "ignore the view" option, covered next'},
    {title:'Table Calculations', text:'a different tool for a similar-sounding problem'},
  ],
  exercise:{type:'concept', q:'In plain terms, what does an LOD expression let you do?',
    options:['Make a number use different grouping than the rest of the view','Make a chart load faster','Format a number as currency'],
    answer:0, hint:'Think back to the Region/Customer example \u2014 it\'s about grouping, not speed or formatting.'}
},
{id:'lod-fixed', track:'LOD Expressions', title:'FIXED',
  concept:`<p><code>{FIXED [Customer] : SUM([Sales])}</code> computes each customer's total Sales across <i>all</i> their orders, then attaches that single number to every row for that customer &mdash; regardless of what else is in the view.</p><p>You can list more than one dimension: <code>{FIXED [Customer],[Category] : SUM([Sales])}</code> computes a total per customer-and-category combination instead of per customer alone &mdash; so the same customer gets a different number for their Technology purchases than their Furniture purchases. The more dimensions you add, the finer the fixed grain gets \u2014 add enough and it converges on row-level detail.</p>`,
  formula:'{ FIXED [Customer] : SUM([Sales]) }',
  anatomy:[
    {tag:'FIXED [Customer]', text:'Locks the calculation to the Customer dimension only.'},
    {tag:'SUM([Sales])', text:'The aggregation performed at that fixed grain.'},
    {tag:'Result', text:'The same total repeats on every row belonging to that customer.'},
  ],
  compute(){
    const byCust = groupBy(sampleData, r=>r.customer);
    const totals = {}; Object.entries(byCust).forEach(([c,rs])=>totals[c]=sum(rs,r=>r.sales));
    const rows = sampleData.slice(0,8).map(r=>[r.customer, money(r.sales), money(totals[r.customer])]);
    return {cols:['Customer','This Order Sales','FIXED [Customer]: SUM(Sales)'], rows, highlightLast:true};
  },
  secondExample:{
    title:'Fixing on two dimensions at once',
    description:'{FIXED [Customer],[Category] : SUM([Sales])} \u2014 a finer grain than customer alone. Every one of A. Diaz\'s and B. Chen\'s orders is listed below, grouped by category. Where a customer has more than one order in the same category, the FIXED total repeats across those rows (it\'s their sum) \u2014 where there\'s only one order, the FIXED total just equals that order.',
    compute(){
      const rows = [];
      ['A. Diaz','B. Chen'].forEach(cust=>{
        const custRows = sampleData.filter(r=>r.customer===cust);
        const cats = uniq(custRows.map(r=>r.category));
        cats.forEach(cat=>{
          const comboRows = custRows.filter(r=>r.category===cat);
          const total = sum(comboRows, r=>r.sales);
          comboRows.forEach(r=>{
            rows.push([cust, cat, money(r.sales), money(total)]);
          });
        });
      });
      return {cols:['Customer','Category','This Order Sales','FIXED [Customer],[Category]: SUM(Sales)'], rows, highlightLast:true};
    }
  },
  pitfalls:[
    {title:'FIXED ignores dimension filters by default', text:'Filter the view down to one region and a FIXED [Customer] total will often still show that customer\'s sales from every region \u2014 add the field to Context Filters if you need FIXED to respect it.'},
    {title:'Too many dimensions defeats the purpose', text:'{FIXED [Region],[Category],[Sub-Category],[Customer],[Order Date] : SUM([Sales])} is so fine-grained it barely aggregates anything \u2014 keep the dimension list to just what the question actually needs.'},
    {title:'Looks identical to a plain SUM at matching granularity', text:'If Customer is the only dimension in the view, {FIXED [Customer]:SUM([Sales])} and plain SUM([Sales]) return the same numbers \u2014 the difference only becomes visible once you add more dimensions or filters to the view.'},
  ],
  related:[
    {title:'EXCLUDE', text:'the opposite move \u2014 compute a coarser total than the view'},
    {title:'Row-Level vs. Aggregate', text:'why {FIXED...} can be used where a bare SUM() sometimes can\'t'},
  ],
  build:{
    prompt:'Build a calc that returns each customer\'s total Sales across all their orders, fixed regardless of the view.',
    calcKind:'lod', viewDims:[],
    getMarks:(data)=>data.slice(0,8).map(r=>({label:`${r.customer} \u2014 ${r.subCategory}`, rows:[r]})),
    solution:"{FIXED [Customer] : SUM([Sales])}",
    hint:'{ FIXED [Customer] : SUM([Sales]) }',
    format: v => money(v),
    palette:{functions:['SUM'], keywords:['FIXED'], operators:[]}
  }
},
{id:'lod-include', track:'LOD Expressions', title:'INCLUDE',
  concept:`<p><code>{INCLUDE [Sub-Category] : AVG([Profit])}</code> first averages Profit at the Sub-Category grain (finer than Category), then that result gets re-aggregated up to whatever the view shows &mdash; e.g. Category. It's useful when you need a calculation to respect a dimension that isn't in your view.</p><p>INCLUDE is relative, not absolute: the same formula produces different numbers depending on what dimensions are already in the view. That's different from FIXED, whose dimension list is the whole story regardless of the view \u2014 worth remembering when a number changes unexpectedly after you add a field to the view.</p>`,
  formula:'{ INCLUDE [Sub-Category] : AVG([Profit]) }',
  anatomy:[
    {tag:'INCLUDE [Sub-Category]', text:'Adds Sub-Category to the computation even though the view is only at Category level.'},
    {tag:'AVG([Profit])', text:'Averaged per sub-category first.'},
    {tag:'Category rollup', text:'Tableau then re-aggregates those sub-category averages up to Category using the view\'s default aggregation.'},
  ],
  compute(){
    const byCat = groupBy(sampleData, r=>r.category);
    const rows = Object.entries(byCat).map(([cat,rs])=>{
      const bySub = groupBy(rs, r=>r.subCategory);
      const subAvgs = Object.values(bySub).map(g=>sum(g,r=>r.profit)/g.length);
      const rollup = subAvgs.reduce((a,b)=>a+b,0)/subAvgs.length;
      return [cat, uniq(rs.map(r=>r.subCategory)).join(', '), money(rollup)];
    });
    return {cols:['Category','Sub-Categories included','AVG of sub-category AVG(Profit)'], rows};
  },
  secondExample:{
    title:'INCLUDE at a Region-level view instead',
    description:'{INCLUDE [Customer] : SUM([Sales])} averaged up to Region \u2014 the average customer\'s total spend within each region.',
    compute(){
      const byRegion = groupBy(sampleData, r=>r.region);
      const rows = Object.entries(byRegion).map(([region,rs])=>{
        const byCust = groupBy(rs, r=>r.customer);
        const custTotals = Object.values(byCust).map(g=>sum(g,r=>r.sales));
        const avg = custTotals.reduce((a,b)=>a+b,0)/custTotals.length;
        return [region, uniq(rs.map(r=>r.customer)).length, money(avg)];
      });
      return {cols:['Region','Customers included','AVG of per-customer SUM(Sales)'], rows};
    }
  },
  pitfalls:[
    {title:'The result depends on the view', text:'Unlike FIXED, an INCLUDE\'s result changes if you add or remove dimensions from the view \u2014 that\'s the point, but it means the "same" calculation can show different numbers on different sheets.'},
    {title:'The outer aggregation changes the meaning', text:'AVG({INCLUDE...}) and SUM({INCLUDE...}) roll the sub-category values up completely differently \u2014 pick the outer aggregation deliberately, not by default.'},
    {title:'Meaningless at the same grain as the view', text:'If Sub-Category is already the only dimension in the view, INCLUDE [Sub-Category] adds nothing \u2014 INCLUDE only does something useful when the view is coarser than the included dimension.'},
  ],
  related:[
    {title:'FIXED', text:'an absolute grain that doesn\'t depend on the view'},
    {title:'EXCLUDE', text:'the mirror-image move in the other direction'},
  ],
  build:{
    prompt:'At a Category-level view, build a calc that averages each sub-category\'s average Profit, rolled up to Category.',
    calcKind:'lod', viewDims:['category'],
    getMarks:(data)=>['Technology','Furniture','Office Supplies'].map(cat=>({label:cat, rows:data.filter(r=>r.category===cat)})),
    solution:"AVG({INCLUDE [Sub-Category] : AVG([Profit])})",
    hint:'Wrap an INCLUDE LOD (averaging Profit per sub-category) inside an outer AVG.',
    format: v => money(v),
    palette:{functions:['AVG'], keywords:['INCLUDE'], operators:[]}
  }
},
{id:'lod-exclude', track:'LOD Expressions', title:'EXCLUDE',
  concept:`<p><code>{EXCLUDE [Sub-Category] : SUM([Sales])}</code> removes Sub-Category from the calc, producing the Category total &mdash; then repeats that total on every Sub-Category row. This is the classic pattern for "% of parent total".</p><p>EXCLUDE only removes dimensions that are actually in the view. If Sub-Category isn't present, <code>{EXCLUDE [Sub-Category] : ...}</code> has nothing to exclude and just behaves like a normal aggregation at the view's grain \u2014 a common source of "why didn't this do anything?" confusion.</p>`,
  formula:"[Sales] / { EXCLUDE [Sub-Category] : SUM([Sales]) }",
  anatomy:[
    {tag:'EXCLUDE [Sub-Category]', text:'Removes Sub-Category from the calc, rolling up to Category (the next dimension up in the view).'},
    {tag:'SUM([Sales])', text:'Category-level total, repeated on every sub-category row.'},
    {tag:'[Sales] / { ... }', text:'Dividing the row-level Sales by the category total gives % of category.'},
  ],
  compute(){
    const byCat = groupBy(sampleData, r=>r.category);
    const catTotals = {}; Object.entries(byCat).forEach(([c,rs])=>catTotals[c]=sum(rs,r=>r.sales));
    const bySub = groupBy(sampleData, r=>r.category+'|'+r.subCategory);
    const rows = Object.entries(bySub).map(([key,rs])=>{
      const [cat,sub]=key.split('|');
      const subTotal = sum(rs,r=>r.sales);
      const pctVal = (subTotal/catTotals[cat]*100).toFixed(1)+'%';
      return [cat, sub, money(subTotal), money(catTotals[cat]), pctVal];
    });
    return {cols:['Category','Sub-Category','Sub-Cat Sales','EXCLUDE: Category Sales','% of Category'], rows};
  },
  secondExample:{
    title:'Excluding Category: a customer\'s share of their own total, by category',
    description:'At a Customer + Category view, {EXCLUDE [Category] : SUM([Sales])} rolls up to Customer \u2014 answering "what % of this customer\'s overall spend happened in each category." Each customer\'s percentages add up to 100%, since together their categories cover every one of their orders.',
    compute(){
      const rows = [];
      ['A. Diaz','B. Chen'].forEach(cust=>{
        const custRows = sampleData.filter(r=>r.customer===cust);
        const custTotal = sum(custRows, r=>r.sales);
        const cats = uniq(custRows.map(r=>r.category));
        cats.forEach(cat=>{
          const catTotal = sum(custRows.filter(r=>r.category===cat), r=>r.sales);
          const pctVal = (catTotal/custTotal*100).toFixed(1)+'%';
          rows.push([cust, cat, money(catTotal), money(custTotal), pctVal]);
        });
      });
      return {cols:['Customer','Category','Category Sales (this cust.)','EXCLUDE: Customer Total','% of Customer Total'], rows, highlightLast:true};
    }
  },
  pitfalls:[
    {title:'Excluding a dimension not in the view does nothing', text:'{EXCLUDE [Region] : SUM([Sales])} at a Category-only view has no Region to remove \u2014 it just becomes an ordinary SUM at the Category grain.'},
    {title:'Divide-by-zero returns NULL, not an error', text:'If the EXCLUDE total happens to be zero for some slice, the division silently returns NULL \u2014 worth a ZN() or IFNULL() guard in a production calc.'},
    {title:'EXCLUDE computes before row-level math around it', text:'In [Sales] / {EXCLUDE...}, the EXCLUDE resolves to its own total first, independent of the surrounding division \u2014 it doesn\'t "see" the rest of the formula.'},
  ],
  related:[
    {title:'INCLUDE', text:'the mirror-image move \u2014 add detail instead of removing it'},
    {title:'TOTAL()', text:'a table-calc alternative for a similar % of total pattern'},
  ],
  build:{
    prompt:'At a Sub-Category-level view, build a calc for % of the parent Category\'s total Sales.',
    calcKind:'lod', viewDims:['category','subCategory'],
    getMarks:(data)=>{
      const bySub = groupBy(data, r=>r.category+'|'+r.subCategory);
      return Object.keys(bySub).map(key=>{ const [cat,sub]=key.split('|'); return {label:`${cat} \u2014 ${sub}`, rows:data.filter(r=>r.category===cat && r.subCategory===sub)}; });
    },
    solution:"[Sales] / {EXCLUDE [Sub-Category] : SUM([Sales])}",
    hint:'Divide the row-level [Sales] by an EXCLUDE LOD that rolls Sales up to Category.',
    format: v => pct(v),
    palette:{functions:['SUM'], keywords:['EXCLUDE'], operators:['/']}
  }
},
{id:'tc-basics', track:'Table Calculations', title:'What Makes Table Calcs Different',
  concept:`<p>Table calculations run <b>after</b> the data has already been queried and aggregated &mdash; they operate on the numbers already shown in the view. That's the opposite order from LOD expressions, which run as part of the query itself. Table calcs need two settings: <b>addressing</b> (which direction to compute across, e.g. down a Date axis) and <b>partitioning</b> (which dimensions restart the calculation).</p><p>In the actual Tableau UI these settings live in the "Edit Table Calculation" dialog on the field's context menu, not in the formula text itself. In this tutorial, each table-calc lesson sets addressing/partitioning for you so you can focus purely on the formula syntax.</p>`,
  formula:'Query runs \u2192 aggregated marks appear in view \u2192 table calc runs on those marks',
  anatomy:[
    {tag:'Addressing', text:'The dimension(s) the calc moves across, e.g. Order Date for a running total over time.'},
    {tag:'Partitioning', text:'The dimension(s) that reset the calc into separate groups, e.g. a new running total per Region.'},
  ],
  compute(){
    return {cols:['Concept','LOD Expression','Table Calculation'], rows:[
      ['Runs', 'Inside the data source query', 'After the query, on the aggregated view'],
      ['Controlled by', 'FIXED / INCLUDE / EXCLUDE + dimension', 'Addressing + partitioning fields'],
      ['Typical use', 'Custom granularity (customer totals, % of parent)', 'Running totals, ranks, moving averages'],
    ]};
  },
  secondExample:{
    title:'Quick decision guide',
    description:'A rough rule of thumb for choosing between the two approaches.',
    compute(){
      return {cols:['If you need\u2026', 'Reach for'], rows:[
        ['A number that stays the same no matter how the view is sliced', 'LOD: FIXED'],
        ['A running/cumulative total in a specific sort order', 'Table calc: RUNNING_SUM'],
        ['Each row\u2019s rank among its peers', 'Table calc: RANK'],
        ['A subtotal at a coarser or finer grain than the view', 'LOD: EXCLUDE / INCLUDE'],
      ]};
    }
  },
  pitfalls:[
    {title:'The view\'s structure IS the calc\'s input', text:'Add, remove, sort, or filter a field in the view and a table calc\'s addressing/partitioning can silently shift with it \u2014 unlike a FIXED LOD, which doesn\'t care about the view.'},
    {title:'Filters change history', text:'Filtering out early dates and re-running a RUNNING_SUM changes every subsequent cumulative value, since it now starts counting later \u2014 usually intended, but easy to forget when explaining a dashboard.'},
    {title:'Nesting rules are strict', text:'Table calculations can\'t be nested directly inside another table calculation, and mixing them with LODs has specific rules \u2014 if a formula won\'t validate, check whether you\'re trying to nest two table calcs.'},
  ],
  related:[
    {title:'FIXED / INCLUDE / EXCLUDE', text:'the query-time alternative to table calcs'},
  ],
  exercise:{type:'concept', q:'Table calculations run:', options:['Before the data is aggregated','After the data is aggregated into the view','Inside the SQL query'], answer:1, hint:'They operate on the marks already showing.'}
},
{id:'tc-running', track:'Table Calculations', title:'Running Total',
  concept:`<p><code>RUNNING_SUM(SUM([Sales]))</code> adds each mark's value to the running sum of everything before it, in whatever order the view is sorted &mdash; here, by Order Date.</p><p><code>RUNNING_AVG</code> and <code>RUNNING_COUNT</code> follow the identical pattern for a running average or running count instead of a running total. All three depend entirely on the addressing (sort order) being what you expect \u2014 the formula itself has no idea what "before" means without it.</p>`,
  formula:'RUNNING_SUM(SUM([Sales]))',
  anatomy:[
    {tag:'SUM([Sales])', text:'The aggregated value being accumulated &mdash; total Sales per date in the view.'},
    {tag:'RUNNING_SUM(...)', text:'Adds each row\'s value to the sum of every row addressed before it.'},
  ],
  compute(){
    const sorted = [...sampleData].sort((a,b)=>a.date.localeCompare(b.date));
    let running=0;
    const rows = sorted.slice(0,10).map(r=>{running+=r.sales; return [r.date, r.customer, money(r.sales), money(running)];});
    return {cols:['Order Date','Customer','Sales','RUNNING_SUM(SUM(Sales))'], rows, highlightLast:true};
  },
  secondExample:{
    title:'Partitioned by Region: a separate running total per region',
    description:'Adding Region as a partition resets the running sum back to zero every time the region changes, instead of accumulating across the whole table.',
    compute(){
      const sorted = [...sampleData].sort((a,b)=> a.region===b.region ? a.date.localeCompare(b.date) : a.region.localeCompare(b.region));
      let running=0, lastRegion=null;
      const rows = sorted.slice(0,9).map(r=>{
        if(r.region!==lastRegion){ running=0; lastRegion=r.region; }
        running += r.sales;
        return [r.region, r.date, money(r.sales), money(running)];
      });
      return {cols:['Region (partition)','Order Date','Sales','RUNNING_SUM(SUM(Sales))'], rows, highlightLast:true};
    }
  },
  pitfalls:[
    {title:'Wrong sort order breaks everything silently', text:'RUNNING_SUM doesn\'t validate that your sort makes sense \u2014 sort by Customer name instead of Date and you\'ll get a perfectly computed running total that means nothing.'},
    {title:'Forgetting to partition', text:'Without a partition, a running total accumulates across the entire table, which is rarely what you want if the view has more than one region, category, or other grouping dimension.'},
    {title:'Filtering changes history', text:'Trim the date range and every downstream cumulative value shifts, since the running total now starts counting from a later point.'},
  ],
  related:[
    {title:'RANK', text:'another table calc, ordering marks by value instead of accumulating them'},
    {title:'WINDOW_SUM / TOTAL', text:'a fixed total across a window instead of a growing accumulation'},
  ],
  build:{
    prompt:'Build a calc that accumulates Sales over time, ordered by Order Date.',
    calcKind:'tablecalc', viewDims:['id'], addressDim:'date', partitionDims:[],
    getMarks:(data)=>[...data].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10).map(r=>({label:`${r.date} \u2014 ${r.customer}`, rows:[r]})),
    solution:"RUNNING_SUM(SUM([Sales]))",
    hint:'RUNNING_SUM wraps an aggregated measure: RUNNING_SUM(SUM([Sales]))',
    format: v => money(v),
    palette:{functions:['SUM','RUNNING_SUM'], keywords:[], operators:[]}
  }
},
{id:'tc-rank', track:'Table Calculations', title:'RANK',
  concept:`<p><code>RANK(SUM([Sales]))</code> orders marks by value and assigns 1 to the highest. Add a <code>partition</code> (e.g. by Region) to restart the ranking within each group instead of across the whole table.</p><p>Tableau actually offers several RANK variants: plain <code>RANK</code> leaves gaps after ties (1, 1, 3), <code>RANK_DENSE</code> doesn't (1, 1, 2), and <code>RANK_UNIQUE</code> never ties at all, breaking ties by row order (1, 2, 3). This tutorial focuses on plain RANK since it's the one you'll reach for most often.</p>`,
  formula:'RANK(SUM([Sales]))\n// partitioned by Region',
  anatomy:[
    {tag:'SUM([Sales])', text:'The measure being ranked.'},
    {tag:'RANK(...)', text:'1 = highest value. Ties share a rank and skip the next number (standard competition ranking).'},
    {tag:'Partition: Region', text:'Ranking restarts at 1 for each Region instead of running across all rows.'},
  ],
  compute(){
    const byRegion = groupBy(sampleData, r=>r.region);
    let rows=[];
    Object.entries(byRegion).forEach(([region,rs])=>{
      const byCust = groupBy(rs, r=>r.customer);
      const totals = Object.entries(byCust).map(([c,g])=>[c,sum(g,r=>r.sales)]).sort((a,b)=>b[1]-a[1]);
      totals.forEach(([c,s],i)=>rows.push([region, c, money(s), i+1]));
    });
    return {cols:['Region (partition)','Customer','SUM(Sales)','RANK'], rows, highlightLast:true};
  },
  secondExample:{
    title:'No partition: ranking Categories across the whole table',
    description:'Drop the partition entirely and RANK compares every mark in the view against every other mark, not just within a group.',
    compute(){
      const byCat = groupBy(sampleData, r=>r.category);
      const totals = Object.entries(byCat).map(([c,rs])=>[c,sum(rs,r=>r.sales)]).sort((a,b)=>b[1]-a[1]);
      const rows = totals.map(([c,s],i)=>[c, money(s), i+1]);
      return {cols:['Category','SUM(Sales)','RANK (whole table)'], rows, highlightLast:true};
    }
  },
  pitfalls:[
    {title:'Forgetting which direction is "best"', text:'RANK defaults to highest-value-first. For something like "rank by lowest cost," you\'ll need to negate the value or otherwise flip the comparison.'},
    {title:'Wrong or missing partition', text:'No partition ranks everything against everything; too broad a partition can silently exclude the comparison you actually wanted (e.g. partitioning by Customer when you meant to rank customers against each other).'},
    {title:'Ties produce gaps', text:'Plain RANK skips numbers after a tie (1, 1, 3) \u2014 if you need consecutive ranks instead, that\'s RANK_DENSE, not RANK.'},
  ],
  related:[
    {title:'RUNNING_SUM', text:'accumulates values in order rather than ranking them'},
    {title:'WINDOW_AVG / TOTAL', text:'compare a mark to a group average instead of a rank position'},
  ],
  build:{
    prompt:'Build a calc that ranks each customer\'s total Sales, restarting at 1 within each Region.',
    calcKind:'tablecalc', viewDims:['region','customer'], addressDim:null, partitionDims:['region'],
    getMarks:(data)=>{
      const byRegion = groupBy(data, r=>r.region);
      let marks=[];
      ['East','West','Central'].forEach(region=>{
        const byCust = groupBy(byRegion[region]||[], r=>r.customer);
        Object.keys(byCust).forEach(c=>marks.push({label:`${region} \u2014 ${c}`, rows:byCust[c]}));
      });
      return marks;
    },
    solution:"RANK(SUM([Sales]))",
    hint:'RANK(SUM([Sales])) \u2014 partitioning by Region is handled by the exercise setup.',
    format: v => String(v),
    palette:{functions:['SUM','RANK'], keywords:[], operators:[]}
  }
},
{id:'tc-window', track:'Table Calculations', title:'Window Functions & % of Total',
  concept:`<p>RUNNING_SUM and RANK both look beyond just their own row \u2014 they compare against other marks in the view. "Window functions" is the general name for that whole family: any table calc that looks across a group of marks (a <b>window</b>) instead of computing something purely from its own row.</p><p>By default, the window is "every mark sharing the same partition." <code>TOTAL()</code> is the simplest window function there is: it just adds up every mark in the window, full stop. <code>WINDOW_AVG()</code> averages them instead of summing. Neither one cares about sort order (addressing) the way RUNNING_SUM does \u2014 they just pool the window together.</p><p>Once you know that, <code>SUM([Sales]) / TOTAL(SUM([Sales]))</code> reads naturally: "my value, divided by everyone in my window added together" &mdash; which is exactly what a percent-of-total means. The only thing to keep straight is that "everyone" means "everyone in the same partition," which might be the whole table or a narrower slice, depending on how partitioning is set up.</p>`,
  formula:'SUM([Sales]) / TOTAL(SUM([Sales]))',
  anatomy:[
    {tag:'SUM([Sales])', text:'This row/mark\'s value.'},
    {tag:'TOTAL(SUM([Sales]))', text:'Every mark in this row\'s window, added together \u2014 unaffected by sort order.'},
    {tag:'A / TOTAL(A)', text:'Row value divided by the whole window gives percent of total.'},
  ],
  deepDive:{
    title:'Deep Dive: What Is a "Window," Really?',
    intro:`<p>The easiest way to actually see a window is to list out which marks are in it. A "window" is nothing more than: which other marks get pooled together with this one? Change the partition, and you change who\'s in the window \u2014 that\'s the whole mechanic.</p>`,
    examples:[
      {
        title:'No partition: one big window, shared by everyone',
        description:'With no partition set, "the same partition" just means "the whole table." All three categories share one window, which is exactly why TOTAL(SUM(Sales)) comes out identical on every single row.',
        compute(){
          const byCat = groupBy(sampleData, r=>r.category);
          const cats = Object.keys(byCat);
          const grand = sum(sampleData, r=>r.sales);
          const rows = cats.map(cat=>[cat, cats.join(', '), money(grand)]);
          return {cols:['This mark','Every mark in its window','TOTAL(SUM(Sales))'], rows, highlightLast:true};
        }
      },
      {
        title:'Partitioned by Region: smaller, separate windows',
        description:'Add Region as a partition and each mark\'s window shrinks to just the categories within its own region \u2014 three separate windows instead of one shared one. TOTAL(SUM(Sales)) now differs by region, because it\'s only adding up what\'s inside each smaller window.',
        compute(){
          const byRegion = groupBy(sampleData, r=>r.region);
          let rows = [];
          ['East','West','Central'].forEach(region=>{
            const rs = byRegion[region]||[];
            const cats = uniq(rs.map(r=>r.category));
            const regionTotal = sum(rs, r=>r.sales);
            cats.forEach(cat=>rows.push([`${region} \u2014 ${cat}`, `${cats.join(', ')} (${region} only)`, money(regionTotal)]));
          });
          return {cols:['This mark','Every mark in its window','TOTAL(SUM(Sales))'], rows, highlightLast:true};
        }
      },
      {
        title:'Proof: WINDOW_AVG includes the current mark',
        description:'If WINDOW_AVG meant "average of everyone else," it would give a different number for each category (since each one excludes something different). Instead, watch it stay exactly the same for all three \u2014 that\'s only possible if the current mark is counted every time.',
        compute(){
          const byCat = groupBy(sampleData, r=>r.category);
          const cats = Object.keys(byCat);
          const totals = cats.map(c=>[c, sum(byCat[c], r=>r.sales)]);
          const grand = sum(sampleData, r=>r.sales);
          const rows = totals.map(([cat,t])=>{
            const windowAvg = grand/cats.length;
            const excludingSelf = (grand - t)/(cats.length-1);
            return [cat, money(windowAvg), money(excludingSelf)];
          });
          return {cols:['Category','WINDOW_AVG(SUM(Sales))  \u2014  actually happens','If it excluded this row  \u2014  hypothetical'], rows};
        }
      }
    ],
    notes:[
      {title:'Same question either way: who\'s in the window?', text:'RUNNING_SUM, RANK, WINDOW_AVG, and TOTAL are all just different things to do once you know the window\'s membership. Figuring out the partition (who\'s in the window) is 90% of getting a table calc right \u2014 the function you pick is the easy part.'},
    ]
  },
  compute(){
    const byCat = groupBy(sampleData, r=>r.category);
    const totals = Object.entries(byCat).map(([c,rs])=>[c,sum(rs,r=>r.sales)]);
    const grand = sum(sampleData, r=>r.sales);
    const avg = grand/totals.length;
    const rows = totals.map(([c,s])=>[c, money(s), money(avg), (s/grand*100).toFixed(1)+'%']);
    return {cols:['Category','SUM(Sales)','WINDOW_AVG(SUM(Sales))','SUM(Sales)/TOTAL(SUM(Sales))'], rows, highlightLast:true};
  },
  secondExample:{
    title:'Partitioned by Region: % of the region, not the grand total',
    description:'Same formula, but with Region as a partition \u2014 each category\'s share now adds up to 100% within its own region, not across the whole table.',
    compute(){
      const byRegion = groupBy(sampleData, r=>r.region);
      let rows = [];
      ['East','West','Central'].forEach(region=>{
        const rs = byRegion[region]||[];
        const regionTotal = sum(rs, r=>r.sales);
        const byCat = groupBy(rs, r=>r.category);
        Object.entries(byCat).forEach(([cat,crs])=>{
          const catTotal = sum(crs, r=>r.sales);
          rows.push([region, cat, money(catTotal), (catTotal/regionTotal*100).toFixed(1)+'%']);
        });
      });
      return {cols:['Region (partition)','Category','SUM(Sales)','SUM(Sales)/TOTAL(SUM(Sales))'], rows, highlightLast:true};
    }
  },
  pitfalls:[
    {title:'TOTAL() respects partitioning, not addressing', text:'If a partition is set, TOTAL() sums only within that partition \u2014 "% of total" silently becomes "% of this partition\'s total," which is easy to miss if you were expecting the grand total.'},
    {title:'WINDOW functions include the current mark', text:'WINDOW_AVG(SUM([Sales])) averages the whole window including the row it\'s displayed on \u2014 it\'s not automatically "everyone else\'s average excluding me." See the Deep Dive above for a live proof.'},
    {title:'Division by zero returns NULL', text:'If TOTAL(SUM([Sales])) happens to be zero for an empty partition, the percentage silently comes back NULL rather than erroring \u2014 worth guarding with ZN() in a real dashboard.'},
  ],
  related:[
    {title:'EXCLUDE', text:'an LOD-based way to compute a similar percent-of-parent number'},
    {title:'RUNNING_SUM', text:'accumulates instead of comparing to a fixed window total'},
  ],
  build:{
    prompt:'Build a calc for each Category\'s % of total Sales across the whole table.',
    calcKind:'tablecalc', viewDims:['category'], addressDim:null, partitionDims:[],
    getMarks:(data)=>['Technology','Furniture','Office Supplies'].map(cat=>({label:cat, rows:data.filter(r=>r.category===cat)})),
    solution:"SUM([Sales]) / TOTAL(SUM([Sales]))",
    hint:'Divide SUM([Sales]) by TOTAL(SUM([Sales])).',
    format: v => pct(v),
    palette:{functions:['SUM','TOTAL','WINDOW_AVG'], keywords:[], operators:['/']}
  }
},
];

/* ============================= RENDER: SIDEBAR ============================= */
function renderSidebar(){
  const container = document.getElementById('trackList');
  if(!container) return; // sidebar isn't mounted (e.g. presentation mode) — nothing to update
  const tracks = [...new Set(lessons.map(l=>l.track))];

      ${items.map(({l,i})=>`
