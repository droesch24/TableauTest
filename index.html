<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Variance Viz Extension</title>
  <script src="https://cdn.jsdelivr.net/npm/tableau.extensions.api@1.10.0/lib/tableau.extensions.1.latest.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; background: #fff; color: #222; }
    #loading { padding: 20px; color: #666; font-size: 13px; }
    #error-msg { padding: 12px 16px; background: #fef2f2; color: #b91c1c; font-size: 12px; border-left: 3px solid #ef4444; margin: 8px; border-radius: 4px; display: none; white-space: pre-wrap; }

    .ext-title { font-size: 13px; font-weight: 600; color: #1a1a1a; padding: 10px 8px 8px; border-bottom: 0.5px solid #ddd; }
    .ext-header { display: grid; font-size: 11px; font-weight: 600; color: #555; border-bottom: 1.5px solid #bbb; padding: 5px 0 5px 8px; background: #f9f9f9; }
    .ext-header span { text-align: right; padding-right: 10px; }
    .ext-header span:first-child { text-align: left; padding-right: 0; }
    .ext-header .col-bar { text-align: center; padding-right: 0; }

    .row { display: grid; align-items: center; min-height: 26px; padding-left: 8px; border-bottom: 0.5px solid #ebebeb; }
    .row:nth-child(odd) { background: #fff; }
    .row:nth-child(even) { background: #f7f8fa; }
    .row:hover { background: #dce8f5; }
    .row .name { font-size: 11.5px; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
    .row .num { text-align: right; font-size: 11.5px; font-variant-numeric: tabular-nums; padding-right: 10px; color: #222; }
    .row .num.neg { color: #c0392b; }
    .row .num.pos { color: #1a7c4a; }

    .bar-cell { position: relative; height: 26px; display: flex; align-items: center; }
    .bar-axis { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 1px; background: #ccc; }
    .bar-pos { position: absolute; left: 50%; height: 12px; background: #5b8db8; border-radius: 0 2px 2px 0; }
    .bar-neg { position: absolute; height: 12px; background: #b8c8d8; border-radius: 2px 0 0 2px; right: 50%; }

    .total-row { display: grid; align-items: center; font-weight: 600; font-size: 12px; border-top: 1.5px solid #bbb; padding: 5px 0 5px 8px; background: #f2f2f2; }
    .total-row .num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 10px; }
    .total-row .num.neg { color: #c0392b; }
    .total-row .num.pos { color: #1a7c4a; }
  </style>
</head>
<body>
<div id="app">
  <div id="loading">Connecting to Tableau data…</div>
  <div id="error-msg"></div>
  <div id="viz" style="display:none;">
    <div class="ext-title">Budget vs Actual — Variance</div>
    <div class="ext-header" id="header"></div>
    <div id="rows-container"></div>
    <div class="total-row" id="total-row"></div>
  </div>
</div>

<script>
function fmt(n) {
  const abs = Math.abs(Math.round(n));
  return (n < 0 ? '-$' : '$') + abs.toLocaleString();
}
function fmtPct(v) {
  return (v > 0 ? '+' : '') + v.toFixed(1) + '%';
}

function render(rows) {
  if (!rows || rows.length === 0) {
    showError('No data returned. Make sure Cost Center, Actual and Budget fields are on the Marks card.');
    return;
  }

  const variances = rows.map(r => r.actual - r.budget);
  const maxAbs = Math.max(...variances.map(v => Math.abs(v)), 1);
  const BAR_MAX = 52;
  const colWidth = (BAR_MAX * 2 + 20) + 'px';
  const gridTpl = '1fr 90px 90px ' + colWidth + ' 72px';

  document.getElementById('header').style.gridTemplateColumns = gridTpl;
  document.getElementById('header').innerHTML =
    '<span></span><span>Actual</span><span>Budget</span><span class="col-bar">$ Var</span><span>% Var</span>';

  const container = document.getElementById('rows-container');
  container.innerHTML = '';
  let totalActual = 0, totalBudget = 0;

  rows.forEach(function(r) {
    totalActual += r.actual;
    totalBudget += r.budget;
    const vr = r.actual - r.budget;
    const pct = r.budget !== 0 ? (vr / r.budget) * 100 : 0;
    const barW = Math.abs(vr) / maxAbs * BAR_MAX;
    const row = document.createElement('div');
    row.className = 'row';
    row.style.gridTemplateColumns = gridTpl;
    row.innerHTML =
      '<span class="name" title="' + r.name + '">' + r.name + '</span>' +
      '<span class="num">' + fmt(r.actual) + '</span>' +
      '<span class="num">' + fmt(r.budget) + '</span>' +
      '<div class="bar-cell"><div class="bar-axis"></div>' +
        (vr >= 0
          ? '<div class="bar-pos" style="width:' + barW + 'px;"></div>'
          : '<div class="bar-neg" style="width:' + barW + 'px;"></div>') +
      '</div>' +
      '<span class="num ' + (vr > 0 ? 'neg' : vr < 0 ? 'pos' : '') + '">' + fmtPct(pct) + '</span>';
    container.appendChild(row);
  });

  const tv = totalActual - totalBudget;
  const tp = totalBudget !== 0 ? (tv / totalBudget) * 100 : 0;
  const tBarW = Math.abs(tv) / maxAbs * BAR_MAX;
  const tr = document.getElementById('total-row');
  tr.style.gridTemplateColumns = gridTpl;
  tr.innerHTML =
    '<span>Total</span>' +
    '<span class="num">' + fmt(totalActual) + '</span>' +
    '<span class="num">' + fmt(totalBudget) + '</span>' +
    '<div class="bar-cell" style="position:relative;height:26px;display:flex;align-items:center;">' +
      '<div class="bar-axis" style="position:absolute;left:50%;top:4px;bottom:4px;width:1px;background:#ccc;"></div>' +
      (tv >= 0
        ? '<div class="bar-pos" style="width:' + tBarW + 'px;"></div>'
        : '<div class="bar-neg" style="width:' + tBarW + 'px;"></div>') +
    '</div>' +
    '<span class="num ' + (tv > 0 ? 'neg' : tv < 0 ? 'pos' : '') + '">' + fmtPct(tp) + '</span>';

  document.getElementById('loading').style.display = 'none';
  document.getElementById('viz').style.display = 'block';
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

function toNumber(v) {
  if (typeof v === 'number') return v;
  if (v === null || v === undefined || v === '%null%') return 0;
  const s = String(v).replace(/[$,%\s]/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function loadData(worksheet) {
  worksheet.getSummaryDataAsync({ ignoreSelection: true }).then(function(sumData) {
    const cols = sumData.columns;
    const colIndex = {};
    cols.forEach(function(c, i) { colIndex[c.fieldName] = i; });

    // Find columns by encoding id or field name fallback
    const nameIdx   = colIndex['Cost Center Level 1'] !== undefined ? colIndex['Cost Center Level 1']
                    : colIndex['detail'] !== undefined ? colIndex['detail']
                    : 0;
    const actualIdx = colIndex['SUM(Actual)'] !== undefined ? colIndex['SUM(Actual)']
                    : colIndex['Actual'] !== undefined ? colIndex['Actual']
                    : colIndex['actual'] !== undefined ? colIndex['actual']
                    : 1;
    const budgetIdx = colIndex['SUM(Budget)'] !== undefined ? colIndex['SUM(Budget)']
                    : colIndex['Budget'] !== undefined ? colIndex['Budget']
                    : colIndex['budget'] !== undefined ? colIndex['budget']
                    : 2;

    const rows = sumData.data.map(function(row) {
      return {
        name:   String(row[nameIdx].formattedValue || row[nameIdx].value),
        actual: toNumber(row[actualIdx].value),
        budget: toNumber(row[budgetIdx].value)
      };
    });

    render(rows);
  }).catch(function(e) {
    showError('getSummaryDataAsync failed:\n' + e.message);
  });
}

tableau.extensions.initializeAsync().then(function() {
  const vizInterface = tableau.extensions.vizExtensionInterface;
  const worksheet = vizInterface.worksheet;

  loadData(worksheet);

  worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, function() {
    loadData(worksheet);
  });
}).catch(function(e) {
  showError('Tableau init failed:\n' + e.message);
});
</script>
</body>
</html>
