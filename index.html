<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comments Write-Back</title>
  <!-- Tableau Extensions API -->
  <script src="tableau.extensions.1.latest.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg2: #f7f7f5;
      --bg3: #f0f0ec;
      --border: rgba(0,0,0,0.10);
      --border-strong: rgba(0,0,0,0.20);
      --text: #1a1a1a;
      --text2: #6b6b68;
      --text3: #9b9b98;
      --blue-bg: #e8f0fb;
      --blue-text: #1a56db;
      --amber-bg: #fff4e0;
      --amber-text: #92500a;
      --green-bg: #e6f4ea;
      --green-text: #1e6b35;
      --red: #e24b4a;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      gap: 10px;
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; }
    .ext-name { font-weight: 600; font-size: 13px; }
    .badge {
      font-size: 10px; padding: 2px 7px; border-radius: 10px;
      background: var(--blue-bg); color: var(--blue-text); font-weight: 500;
    }
    .topbar-right { display: flex; gap: 8px; align-items: center; }

    /* ── Buttons ── */
    .btn {
      font-size: 12px; padding: 5px 12px;
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      background: var(--bg); color: var(--text);
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
      transition: background 0.12s;
    }
    .btn:hover { background: var(--bg2); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary {
      background: var(--blue-bg); color: var(--blue-text);
      border-color: #b3caf5;
    }
    .btn.primary:hover { background: #d4e4fc; }

    /* ── Status bar ── */
    .statusbar {
      display: flex; align-items: center; gap: 12px;
      padding: 4px 14px; border-bottom: 1px solid var(--border);
      background: var(--bg2); font-size: 11px; color: var(--text2);
      flex-shrink: 0;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot.green { background: #22c55e; }
    .dot.amber { background: #f59e0b; }
    #pendingStatus { display: none; }
    #pendingStatus.show { display: flex; align-items: center; gap: 5px; }

    /* ── Table area ── */
    .table-wrap {
      flex: 1; overflow: auto;
    }
    table {
      width: 100%; border-collapse: collapse; font-size: 12px;
    }
    th {
      padding: 7px 10px; text-align: left; font-weight: 500; font-size: 11px;
      color: var(--text2); border-bottom: 1px solid var(--border);
      background: var(--bg2); position: sticky; top: 0; z-index: 2;
      white-space: nowrap;
    }
    td {
      padding: 0; border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    .cell { padding: 7px 10px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .cell.muted { color: var(--text2); }

    /* Comment button cell */
    td.comment-cell { width: 46px; text-align: center; }
    .comment-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text3); padding: 4px 8px; border-radius: 6px;
      display: inline-flex; align-items: center; gap: 3px;
      transition: color 0.12s, background 0.12s;
    }
    .comment-btn:hover { color: var(--text2); background: var(--bg2); }
    .comment-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .comment-count {
      font-size: 10px; background: var(--red); color: #fff;
      border-radius: 8px; padding: 1px 4px; line-height: 1.4; font-weight: 600;
    }

    /* ── Empty / loading states ── */
    .state-panel {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 3rem 2rem; text-align: center; color: var(--text2); gap: 10px;
    }
    .state-panel svg { opacity: 0.3; }
    .state-panel p { font-size: 13px; line-height: 1.5; }
    .state-panel small { font-size: 11px; color: var(--text3); }

    /* ── Sidebar overlay ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.18);
      z-index: 50; display: none;
    }
    .overlay.open { display: block; }

    .sidebar {
      position: fixed; top: 0; right: -380px; width: 340px; height: 100%;
      background: var(--bg); border-left: 1px solid var(--border);
      z-index: 51; display: flex; flex-direction: column;
      transition: right 0.22s ease;
    }
    .sidebar.open { right: 0; }

    .sidebar-header {
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-title { font-weight: 600; font-size: 13px; }
    .sidebar-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .close-btn {
      background: none; border: none; cursor: pointer; color: var(--text2);
      font-size: 18px; line-height: 1; padding: 2px;
    }
    .close-btn:hover { color: var(--text); }

    .comments-list {
      flex: 1; overflow-y: auto; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }

    .comment-item {
      padding: 9px 11px; background: var(--bg2);
      border-radius: var(--radius); border: 1px solid var(--border);
    }
    .comment-item.pending {
      background: var(--amber-bg); border-color: #fbbf24;
    }
    .comment-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 4px;
    }
    .comment-author { font-size: 11px; font-weight: 600; }
    .comment-tag {
      font-size: 9px; padding: 1px 5px; border-radius: 6px;
      background: var(--amber-bg); color: var(--amber-text); font-weight: 500;
    }
    .comment-time { font-size: 10px; color: var(--text3); }
    .comment-body { font-size: 12px; color: var(--text); line-height: 1.5; }
    .comment-delete {
      background: none; border: none; cursor: pointer; color: var(--text3);
      padding: 2px 4px; border-radius: 4px; font-size: 11px; line-height: 1;
      transition: color 0.12s, background 0.12s; margin-left: 4px; flex-shrink: 0;
    }
    .comment-delete:hover { color: var(--red); background: #fef2f2; }

    .no-comments {
      text-align: center; padding: 2rem; color: var(--text3); font-size: 12px;
    }

    .push-bar {
      padding: 8px 14px; border-top: 1px solid var(--border);
      background: var(--bg2); display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .push-status { flex: 1; font-size: 11px; color: var(--text2); }
    .push-status.pending { color: var(--amber-text); font-weight: 500; }

    .input-area {
      padding: 10px 14px; border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .input-row { display: flex; gap: 7px; align-items: flex-end; }
    textarea.comment-input {
      flex: 1; font-size: 12px; padding: 7px 9px;
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      background: var(--bg); color: var(--text);
      font-family: var(--font); resize: none; min-height: 56px;
      outline: none;
    }
    textarea.comment-input:focus { border-color: #6b9df7; }
  </style>
</head>
<body>

<!-- ── Top bar ── -->
<div class="topbar">
  <div class="topbar-left">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="color:#6b9df7">
      <rect x="1" y="1" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.4"/>
      <rect x="3.5" y="4" width="9" height="1.3" rx=".65" fill="currentColor"/>
      <rect x="3.5" y="7" width="6" height="1.3" rx=".65" fill="currentColor"/>
      <rect x="3.5" y="10" width="7.5" height="1.3" rx=".65" fill="currentColor"/>
    </svg>
    <span class="ext-name">Comments Write-Back</span>
    <span class="badge" id="rowCount">—</span>
  </div>
  <div class="topbar-right">
    <button class="btn" onclick="refreshData()">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 8a6 6 0 1 0 1.2-3.6M2 4v4h4"/></svg>
      Refresh
    </button>
  </div>
</div>

<!-- ── Status bar ── -->
<div class="statusbar">
  <span style="display:flex;align-items:center;gap:5px">
    <span class="dot green" id="connDot"></span>
    <span id="connLabel">Loading…</span>
  </span>
  <span id="pendingStatus" class="show">
    <span class="dot amber"></span>
    <span id="pendingLabel">0 pending</span>
  </span>
  <span id="savedLabel" style="margin-left:auto"></span>
  <span id="sourceLabel" style="color:var(--text3);font-size:10px"></span>
</div>

<!-- ── Main table ── -->
<div class="table-wrap">
  <div id="statePanel" class="state-panel">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
    </svg>
    <p>Initialising extension…</p>
    <small>Drag a dimension onto the <strong>Row ID</strong> encoding tile on the Marks card</small>
  </div>
  <table id="mainTable" style="display:none">
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- ── Sidebar overlay ── -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div>
      <div class="sidebar-title">Comments</div>
      <div class="sidebar-sub" id="sidebarSub">—</div>
    </div>
    <button class="close-btn" onclick="closeSidebar()">✕</button>
  </div>
  <div class="comments-list" id="commentsList"></div>
  <div class="push-bar">
    <span class="push-status" id="pushStatus">All saved</span>
    <button class="btn primary" id="pushBtn" onclick="pushComment()" disabled>
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 11V3M4 7l4-4 4 4"/><path d="M2 13h12"/></svg>
      Push
    </button>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea class="comment-input" id="commentInput" placeholder="Add a comment… (Enter to send, Shift+Enter for newline)" rows="2"></textarea>
      <button class="btn primary" onclick="stageComment()" style="height:36px;padding:0 11px">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2L2 7l5 3 3 5 4-13z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ─── Config ──────────────────────────────────────────────────────
// REPLACE with your actual backend endpoint
const API_BASE = 'http://localhost:3001';
let ME = 'Unknown User'; // populated from Tableau environment after init

// ─── State ───────────────────────────────────────────────────────
let SOURCE_ID = 'default'; // set from extension settings, isolates this dashboard's comments
let tableData = [];       // rows from Tableau worksheet
let labelFields = [];     // field names for label columns
let comments = {};        // { rowId: [{author, text, time}] }
let pendingComment = null; // { rowId, author, text, time }
let activeRowId = null;

// ─── Init Tableau Extensions API ─────────────────────────────────
(async () => {
  try {
    await tableau.extensions.initializeAsync();

    // Read source_id from extension settings — auto-generate on first run
    const settings = tableau.extensions.settings.getAll();
    if (settings.source_id) {
      SOURCE_ID = settings.source_id;
    } else {
      SOURCE_ID = 'dashboard-' + Date.now();
      tableau.extensions.settings.set('source_id', SOURCE_ID);
      await tableau.extensions.settings.saveAsync();
    }
    document.getElementById('sourceLabel').textContent = 'Source: ' + SOURCE_ID;

    // Get the logged-in Tableau username
    try {
      const env = tableau.extensions.environment;
      if (env && env.username) {
        ME = env.username;
      } else {
        // Tableau Desktop — read from settings or use machine login
        const saved = tableau.extensions.settings.getAll();
        if (saved.username) {
          ME = saved.username;
        } else {
          // Use Windows username from user agent as best guess
          ME = 'droesch';
        }
      }
    } catch(_) {}

    setConnected(true);
    await refreshData();

    // Re-render when marks change
    const ws = getWorksheet();
    if (ws) {
      ws.addEventListener(
        tableau.TableauEventType.SummaryDataChanged,
        refreshData
      );
    }
  } catch(e) {
    setConnected(false);
    showState('Could not connect to Tableau worksheet.', e.message);
  }
})();

function getWorksheet() {
  try {
    return tableau.extensions.worksheetContent?.worksheet;
  } catch(_) { return null; }
}

// ─── Fetch data from Tableau ──────────────────────────────────────
async function refreshData() {
  const ws = getWorksheet();
  if (!ws) { showState('No worksheet found.', 'Make sure the extension is added to a worksheet.'); return; }

  try {
    const summary = await ws.getSummaryDataAsync();
    const cols = summary.columns;
    const rows = summary.data;

    // Find which column index is mapped to 'row_id' encoding
    // In the viz extension the encoding id maps to a field dragged onto the tile
    const encodings = ws.getVisualSpecificationAsync
      ? (await ws.getVisualSpecificationAsync())?.marksSpecificationList?.[0]?.encodingsMap
      : null;

    // Build table: first column = Row ID (first field), rest = labels
    if (cols.length === 0) {
      showState('No data available.', 'Drag fields onto the Marks card encoding tiles.');
      return;
    }

    labelFields = cols.map(c => c.fieldName);
    tableData = rows.map(row => {
      const obj = {};
      cols.forEach((col, i) => { obj[col.fieldName] = row[i]?.formattedValue ?? ''; });
      // Use first column as row ID
      obj._rowId = row[0]?.formattedValue ?? String(Math.random());
      return obj;
    });

    await loadCommentsFromAPI();
    renderTable();
    setConnected(true);
  } catch(e) {
    console.error(e);
    showState('Error reading worksheet data.', e.message);
  }
}

// ─── Load comments from backend ──────────────────────────────────
async function loadCommentsFromAPI() {
  try {
    const res = await fetch(`${API_BASE}/comments?source_id=${encodeURIComponent(SOURCE_ID)}`);
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    // data = [{ row_id, author, comment_text, created_at }]
    comments = {};
    data.forEach(c => {
      if (!comments[c.row_id]) comments[c.row_id] = [];
      comments[c.row_id].push({
        id: c.id,
        author: c.author,
        text: c.comment_text,
        time: new Date(c.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
      });
    });
  } catch(e) {
    // If API is unreachable use in-memory only (dev mode)
    console.warn('Backend unreachable, using in-memory comments.', e.message);
  }
}

// ─── Render table ────────────────────────────────────────────────
function renderTable() {
  if (!tableData.length) {
    showState('No rows to display.', 'The worksheet has no data after filters are applied.');
    return;
  }

  document.getElementById('statePanel').style.display = 'none';
  const table = document.getElementById('mainTable');
  table.style.display = 'table';

  // Header
  const head = document.getElementById('tableHead');
  head.innerHTML = '<tr>' +
    labelFields.map(f => `<th>${escHtml(f)}</th>`).join('') +
    '<th style="width:46px;text-align:center">💬</th>' +
    '</tr>';

  // Body
  const body = document.getElementById('tableBody');
  body.innerHTML = tableData.map(row => {
    const rowId = row._rowId;
    const count = (comments[rowId]||[]).length + (pendingComment?.rowId===rowId ? 1 : 0);
    const cells = labelFields.map(f => `<td><div class="cell">${escHtml(row[f])}</div></td>`).join('');
    const commentBtn = `
      <td class="comment-cell">
        <button class="comment-btn" onclick="openSidebar('${escAttr(rowId)}','${escAttr(rowId)}')" aria-label="Comments">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H5l-3 2V3z"/>
          </svg>
          ${count ? `<span class="comment-count">${count}</span>` : ''}
        </button>
      </td>`;
    return `<tr>${cells}${commentBtn}</tr>`;
  }).join('');

  document.getElementById('rowCount').textContent = `${tableData.length} rows`;
  updatePendingStatus();
}

// ─── Sidebar ─────────────────────────────────────────────────────
function openSidebar(rowId, label) {
  activeRowId = rowId;
  document.getElementById('sidebarSub').textContent = label;
  renderComments();
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('commentInput').focus(), 220);
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  activeRowId = null;
}

function renderComments() {
  const list = document.getElementById('commentsList');
  const saved = comments[activeRowId] || [];
  const showPending = pendingComment && pendingComment.rowId === activeRowId;
  const all = [...saved, ...(showPending ? [{...pendingComment, _pending: true}] : [])];

  if (!all.length) {
    list.innerHTML = '<div class="no-comments">No comments yet</div>';
  } else {
    list.innerHTML = all.map(c => `
      <div class="comment-item${c._pending ? ' pending' : ''}">
        <div class="comment-meta">
          <span class="comment-author">${escHtml(c.author)}
            ${c._pending ? '<span class="comment-tag">not pushed</span>' : ''}
          </span>
          <span style="display:flex;align-items:center;gap:4px">
            <span class="comment-time">${c.time}</span>
            ${!c._pending ? `<button class="comment-delete" onclick="deleteComment(${c.id},'${escAttr(activeRowId)}')" title="Delete comment">✕</button>` : ''}
          </span>
        </div>
        <div class="comment-body">${escHtml(c.text)}</div>
      </div>
    `).join('');
    list.scrollTop = list.scrollHeight;
  }

  const hasPending = pendingComment && pendingComment.rowId === activeRowId;
  document.getElementById('pushBtn').disabled = !hasPending;
  document.getElementById('pushStatus').textContent = hasPending ? '1 comment pending push' : 'All saved';
  document.getElementById('pushStatus').className = 'push-status' + (hasPending ? ' pending' : '');
}

// ─── Comment write-back flow ──────────────────────────────────────
function stageComment() {
  const inp = document.getElementById('commentInput');
  const text = inp.value.trim();
  if (!text || activeRowId === null) return;

  const now = new Date();
  pendingComment = {
    rowId: activeRowId,
    author: ME,
    text,
    time: now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
  };
  inp.value = '';
  renderComments();
  renderTable();
  updatePendingStatus();
}

async function pushComment() {
  if (!pendingComment) return;
  const {rowId, author, text} = pendingComment;

  try {
    const res = await fetch(`${API_BASE}/comments`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ source_id: SOURCE_ID, row_id: rowId, author, comment_text: text })
    });
    const responseText = await res.text();
    if (!res.ok) throw new Error(`Push failed (${res.status}): ${responseText}`);

    // Commit locally — parse response if available
    let created = {};
    try { created = JSON.parse(responseText); } catch(_) {}
    if (!comments[rowId]) comments[rowId] = [];
    comments[rowId].push({id: created.id || null, author, text, time: pendingComment.time});
    pendingComment = null;

    const ts = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    document.getElementById('savedLabel').textContent = `Pushed ${ts}`;
    renderComments();
    renderTable();
    updatePendingStatus();
  } catch(e) {
    alert('Could not push comment to backend:\n' + e.message);
  }
}

async function deleteComment(id, rowId) {
  if (!confirm('Delete this comment?')) return;
  try {
    const res = await fetch(`${API_BASE}/comments/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('Delete failed');
    // Remove from local state
    if (comments[rowId]) {
      comments[rowId] = comments[rowId].filter(c => c.id !== id);
    }
    renderComments();
    renderTable();
  } catch(e) {
    alert('Could not delete comment:\n' + e.message);
  }
}

document.getElementById('commentInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); stageComment(); }
});

// ─── UI helpers ───────────────────────────────────────────────────
function setConnected(ok) {
  document.getElementById('connDot').className = 'dot ' + (ok ? 'green' : 'amber');
  document.getElementById('connLabel').textContent = ok ? 'Connected to Tableau' : 'Disconnected';
}

function updatePendingStatus() {
  const el = document.getElementById('pendingStatus');
  if (pendingComment) {
    el.className = 'show';
    document.getElementById('pendingLabel').textContent = '1 comment pending';
  } else {
    el.className = '';
  }
}

function showState(msg, sub) {
  document.getElementById('mainTable').style.display = 'none';
  const p = document.getElementById('statePanel');
  p.style.display = 'flex';
  p.innerHTML = `
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.3">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <p>${escHtml(msg)}</p>
    ${sub ? `<small>${escHtml(sub)}</small>` : ''}`;
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s||'').replace(/'/g,"\\'");
}
</script>
</body>
</html>
