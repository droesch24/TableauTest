<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cost Center Entitlements</title>
  <script src="tableau.extensions.1.latest.js"></script>
  <style>
    body { font-family: monospace; font-size: 12px; padding: 12px; background: #1e1e1e; color: #d4d4d4; }
    pre { white-space: pre-wrap; word-break: break-all; }
    .ok  { color: #4ec9b0; }
    .err { color: #f48771; }
    .inf { color: #9cdcfe; }
  </style>
</head>
<body><pre id="log"><span class="inf">Loading…</span></pre>
<script>
'use strict';
const logEl = document.getElementById('log');
function log(msg, cls) {
  console.log(msg);
  logEl.innerHTML += '\n<span class="' + (cls||'') + '">' + msg + '</span>';
}

// Timeout fallback
const initTimeout = setTimeout(() => {
  log('⚠️ initializeAsync timed out after 5s', 'err');
  log('tableau object exists: ' + (typeof tableau !== "undefined"), 'inf');
  log('tableau.extensions exists: ' + (typeof tableau !== "undefined" && !!tableau.extensions), 'inf');
}, 5000);

log('tableau defined: ' + (typeof tableau !== 'undefined'), 'inf');
log('calling initializeAsync…', 'inf');

tableau.extensions.initializeAsync().then(() => {
  clearTimeout(initTimeout);
  log('✅ init OK', 'ok');
  const ws = tableau.extensions.worksheetContent.worksheet;
  log('worksheet: ' + (ws ? ws.name : 'NULL'), 'inf');

  ws.getSummaryDataAsync().then(dt => {
    log('rows: ' + dt.data.length, 'ok');
    log('columns: ' + dt.columns.map(c => c.fieldName).join(', '), 'inf');
  }).catch(e => log('getSummaryDataAsync error: ' + e, 'err'));

}).catch(err => {
  clearTimeout(initTimeout);
  log('❌ init error: ' + err, 'err');
});
</script>
</body>
</html>
