<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cost Center Entitlements</title>
  <script src="https://extensions.cdn.tableau.com/tableau.extensions.1.latest.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px; padding: 12px; background: #f5f6f8; color: #111;
    }
    pre {
      background: #1e1e1e; color: #d4d4d4;
      padding: 12px; border-radius: 6px;
      font-size: 11px; white-space: pre-wrap;
      word-break: break-all; margin-top: 8px;
      max-height: 80vh; overflow-y: auto;
    }
    h3 { font-size: 13px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <h3>🔍 Entitlements Debug</h3>
  <pre id="log">Initializing…</pre>

<script>
'use strict';

function log(msg) {
  console.log('[Entitlements]', msg);
  const el = document.getElementById('log');
  el.textContent += '\n' + msg;
}

tableau.extensions.initializeAsync().then(() => {
  log('✅ init OK');

  const ws = tableau.extensions.worksheet;
  log('worksheet name: ' + ws.name);

  // Try getSummaryDataAsync
  log('\n--- getSummaryDataAsync ---');
  ws.getSummaryDataAsync({ ignoreAliases: false }).then(dt => {
    log('row count: ' + dt.data.length);
    log('columns (' + dt.columns.length + '):');
    dt.columns.forEach(c => log('  [' + c.index + '] fieldName="' + c.fieldName + '" dataType=' + c.dataType));
    if (dt.data.length > 0) {
      log('first row values:');
      dt.data[0].forEach((cell, i) => log('  [' + i + '] value="' + cell.value + '" formatted="' + cell.formattedValue + '"'));
    }
  }).catch(err => log('getSummaryDataAsync ERROR: ' + err));

  // Try getEncodingInfoAsync
  log('\n--- getEncodingInfoAsync ---');
  if (typeof ws.getEncodingInfoAsync === 'function') {
    ws.getEncodingInfoAsync().then(info => {
      log('encoding count: ' + info.length);
      info.forEach(e => {
        log('  id="' + e.id + '" fields=' + JSON.stringify((e.fields||[]).map(f => f.fieldName)));
      });
    }).catch(err => log('getEncodingInfoAsync ERROR: ' + err));
  } else {
    log('getEncodingInfoAsync: NOT AVAILABLE on this version');
  }

}).catch(err => log('❌ init failed: ' + err));
</script>
</body>
</html>
