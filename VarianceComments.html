<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Variance Comments</title>
  <style>
:root {
  --red: #CD0E13;
  --black: #000000;
  --white: #FFFFFF;
  --gray-light: #E0E0E0;
  --gray-mid: #9E9E9E;
  --gray-dark: #616161;
  --gray-darkest: #404040;
  --bg-soft: #F5F5F5;
  --font: 'acumin-pro', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; font-family: var(--font); color: var(--black); background: var(--white); }
.panel { display: flex; flex-direction: column; height: 100%; }

.hdr { padding: 12px 16px; border-bottom: 1px solid var(--gray-light); border-top: 3px solid var(--red); }
.hdr-title { font-weight: 700; font-size: 15px; }
.hdr-sub { font-size: 12px; color: var(--gray-dark); margin-top: 2px; word-break: break-word; }

.list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.empty { color: var(--gray-mid); font-size: 13px; text-align: center; margin-top: 24px; }

.card { background: var(--bg-soft); border: 1px solid var(--gray-light); border-radius: 8px; padding: 8px 10px; }
.card.pending { border-color: var(--red); border-style: dashed; }
.card-top { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.card-user { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-time { color: var(--gray-mid); font-size: 11px; white-space: nowrap; }
.card-tag { color: var(--red); font-size: 10px; font-weight: 700; text-transform: uppercase; }
.card-del { border: 0; background: none; cursor: pointer; color: var(--gray-mid); font-size: 14px; padding: 0 2px; }
.card-del:hover { color: var(--red); }
.card-text { margin-top: 4px; font-size: 13px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; }

.statusbar { display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; background: var(--bg-soft); border-top: 1px solid var(--gray-light);
  font-size: 12px; color: var(--gray-dark); }
.statusbar.dirty #status { color: var(--red); font-weight: 700; }
.btn-push { border: 1px solid var(--red); background: var(--red); color: var(--white);
  border-radius: 6px; padding: 5px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-push:disabled { background: var(--white); color: var(--gray-mid); border-color: var(--gray-light); cursor: default; }

.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--gray-light); }
textarea { flex: 1; resize: none; border: 1px solid var(--gray-mid); border-radius: 8px;
  padding: 8px; font: inherit; font-size: 13px; }
textarea:focus { outline: 2px solid var(--red); outline-offset: -1px; }
textarea:disabled { background: var(--bg-soft); }
.btn-send { width: 42px; border: 1px solid var(--gray-darkest); background: var(--gray-darkest); color: var(--white);
  border-radius: 8px; cursor: pointer; font-size: 16px; align-self: flex-end; height: 42px; }
.btn-send:disabled { background: var(--bg-soft); color: var(--gray-mid); border-color: var(--gray-light); cursor: default; }

</style>
</head>
<body>
  <div class="panel">
    <header class="hdr">
      <div class="hdr-title">Comments</div>
      <div class="hdr-sub" id="rowLabel">Select a row to view comments</div>
    </header>

    <main class="list" id="list"></main>

    <div class="statusbar">
      <span id="status">All saved</span>
      <button id="pushBtn" class="btn-push" disabled>Push</button>
    </div>

    <footer class="composer">
      <textarea id="input" rows="2" disabled
        placeholder="Add a comment... (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="sendBtn" class="btn-send" title="Send" disabled>&#10148;</button>
    </footer>
  </div>

  <script src="tableau.extensions.1.latest.js"></script>
  <script>
// ============================================================
// EDIT THIS FILE ONLY. Everything environment-specific lives here.
// ============================================================
window.COMMENTS_CONFIG = {
  // Power Automate "When an HTTP request is received" URL (one flow, two actions: get / push)
  FLOW_URL: "PASTE_FLOW_HTTP_URL_HERE",

  // Must match the secret your flow checks. NOTE: this is visible in the browser,
  // so it only deters casual misuse. It is not real authentication.
  SHARED_SECRET: "CHANGE_ME",

  // Name of the worksheet on the dashboard whose marks the user clicks
  TARGET_SHEET: "Cost Center Budget vs Actual",

  // Hidden worksheet on the dashboard containing a calculated field USERNAME()
  USER_SHEET: "UserInfo",
  USER_FIELD: "Username",

  // Fields that, combined, uniquely identify a row. Must be on the target
  // sheet (Detail shelf is fine) so they come back with the selected mark.
  KEY_FIELDS: ["Cost Center", "Account"],

  // Field shown under the "Comments" title (the row's friendly name)
  LABEL_FIELD: "Account",

  // These people can delete anyone's comment (flow enforces this too)
  ADMINS: ["cbrown@growmark.com"]
};

</script>
  <script>
/* Variance Comments - Tableau Dashboard Extension
 * Flow: user selects a row -> panel loads that row's comments from the flow.
 * "Send" stages a comment locally; "Push" writes all staged changes (adds + deletes).
 */
(function () {
  const C = window.COMMENTS_CONFIG;
  const $ = (id) => document.getElementById(id);

  const state = {
    user: null,
    key: null,
    label: "",
    saved: [],            // comments from the server for the selected row
    pendingAdds: [],      // {tempId, key, text, user, createdUtc}
    pendingDeletes: [],   // comment IDs of saved comments to delete
    busy: false
  };

  // ---------- Init ----------
  document.addEventListener("DOMContentLoaded", async () => {
    wireUi();
    render();
    try {
      await tableau.extensions.initializeAsync();
      const dash = tableau.extensions.dashboardContent.dashboard;
      state.user = await getUser(dash);
      const ws = dash.worksheets.find((w) => w.name === C.TARGET_SHEET);
      if (!ws) throw new Error('Worksheet "' + C.TARGET_SHEET + '" not found on this dashboard.');
      ws.addEventListener(tableau.TableauEventType.MarkSelectionChanged, () => onSelection(ws));
      setStatus("Ready");
    } catch (e) {
      setStatus("Error: " + e.message, true);
    }
  });

  async function getUser(dash) {
    const ws = dash.worksheets.find((w) => w.name === C.USER_SHEET);
    if (!ws) throw new Error('User worksheet "' + C.USER_SHEET + '" not found.');
    const data = await ws.getSummaryDataAsync({ ignoreSelection: true });
    const idx = data.columns.findIndex((c) => c.fieldName === C.USER_FIELD);
    if (idx < 0 || !data.data.length) throw new Error("Could not read " + C.USER_FIELD + ".");
    return String(data.data[0][idx].formattedValue).toLowerCase();
  }

  // ---------- Selection ----------
  async function onSelection(ws) {
    if (state.busy) return;
    try {
      const marks = await ws.getSelectedMarksAsync();
      const table = marks.data[0];
      if (!table || !table.data.length) { clearSelection(); return; }

      const cols = table.columns.map((c) => c.fieldName);
      const row = table.data[0];
      const val = (name) => {
        const i = cols.indexOf(name);
        return i < 0 ? null : String(row[i].formattedValue);
      };

      const parts = C.KEY_FIELDS.map(val);
      if (parts.some((p) => p === null)) {
        throw new Error("Key field(s) missing from the sheet's marks. Add them to the Detail shelf: " +
          C.KEY_FIELDS.filter((f, i) => parts[i] === null).join(", "));
      }
      state.key = parts.join("|");
      state.label = val(C.LABEL_FIELD) || state.key;
      await loadComments();
    } catch (e) {
      setStatus("Error: " + e.message, true);
    }
  }

  function clearSelection() {
    state.key = null; state.label = ""; state.saved = [];
    render();
  }

  // ---------- API ----------
  async function api(action, payload) {
    // text/plain avoids a CORS preflight, which Power Automate HTTP triggers don't answer.
    const res = await fetch(C.FLOW_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(Object.assign({ secret: C.SHARED_SECRET, action: action, user: state.user }, payload))
    });
    if (!res.ok) throw new Error("Server returned " + res.status);
    return res.json();
  }

  async function loadComments() {
    setBusy(true, "Loading...");
    try {
      const out = await api("get", { key: state.key });
      state.saved = out.comments || [];
    } finally { setBusy(false); }
    render();
  }

  async function push() {
    if (!hasPending()) return;
    setBusy(true, "Pushing...");
    try {
      await api("push", {
        adds: state.pendingAdds.map((a) => ({ key: a.key, text: a.text })),
        deletes: state.pendingDeletes
      });
      state.pendingAdds = [];
      state.pendingDeletes = [];
      if (state.key) await loadComments();
      setStatus("All saved");
    } catch (e) {
      setStatus("Push failed: " + e.message, true);
    } finally { setBusy(false); }
    render();
  }

  // ---------- Local staging ----------
  function sendComment() {
    const text = $("input").value.trim();
    if (!text || !state.key) return;
    state.pendingAdds.push({
      tempId: "tmp-" + Date.now() + Math.random().toString(16).slice(2),
      key: state.key, text: text, user: state.user, createdUtc: new Date().toISOString()
    });
    $("input").value = "";
    render();
  }

  function deleteComment(c) {
    if (c.pending) {
      state.pendingAdds = state.pendingAdds.filter((a) => a.tempId !== c.id);
    } else if (!state.pendingDeletes.includes(c.id)) {
      state.pendingDeletes.push(c.id);
    }
    render();
  }

  const hasPending = () => state.pendingAdds.length > 0 || state.pendingDeletes.length > 0;
  const canDelete = (c) => c.user === state.user || C.ADMINS.map((a) => a.toLowerCase()).includes(state.user);

  // ---------- Rendering ----------
  function visibleComments() {
    const saved = state.saved
      .filter((c) => !state.pendingDeletes.includes(c.id))
      .map((c) => ({ id: c.id, user: c.user, text: c.text, time: c.createdUtc, pending: false }));
    const staged = state.pendingAdds
      .filter((a) => a.key === state.key)
      .map((a) => ({ id: a.tempId, user: a.user, text: a.text, time: a.createdUtc, pending: true }));
    return saved.concat(staged);
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleString("en-US", {
      month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit"
    });
  }

  function render() {
    $("rowLabel").textContent = state.key ? state.label : "Select a row to view comments";
    const list = $("list");
    list.textContent = "";

    if (!state.key) {
      list.appendChild(el("div", "empty", "Click a row in the table to see or add comments."));
    } else {
      const items = visibleComments();
      if (!items.length) list.appendChild(el("div", "empty", "No comments yet."));
      items.forEach((c) => {
        const card = el("div", "card" + (c.pending ? " pending" : ""));
        const top = el("div", "card-top");
        top.appendChild(el("span", "card-user", c.user));
        if (c.pending) top.appendChild(el("span", "card-tag", "Not pushed"));
        else top.appendChild(el("span", "card-time", fmtTime(c.time)));
        if (canDelete(c)) {
          const x = el("button", "card-del", "\u2715");
          x.title = "Delete comment";
          x.onclick = () => deleteComment(c);
          top.appendChild(x);
        }
        card.appendChild(top);
        card.appendChild(el("div", "card-text", c.text));  // textContent: safe from HTML injection
        list.appendChild(card);
      });
    }

    const n = state.pendingAdds.length + state.pendingDeletes.length;
    const bar = document.querySelector(".statusbar");
    bar.classList.toggle("dirty", n > 0);
    if (n > 0) $("status").textContent = n + " change" + (n > 1 ? "s" : "") + " not pushed";
    else if (!state.busy && $("status").textContent.indexOf("Error") !== 0) $("status").textContent = "All saved";

    $("pushBtn").disabled = !n || state.busy;
    $("input").disabled = !state.key || state.busy;
    $("sendBtn").disabled = !state.key || state.busy;
  }

  // ---------- Helpers ----------
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function setStatus(msg, isErr) { $("status").textContent = msg; if (isErr) document.querySelector(".statusbar").classList.add("dirty"); }
  function setBusy(b, msg) { state.busy = b; if (msg) setStatus(msg); if (!b) render(); else render(); }

  function wireUi() {
    $("sendBtn").onclick = sendComment;
    $("pushBtn").onclick = push;
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendComment(); }
    });
  }
})();

</script>
</body>
</html>
